name: sportsdesk-ops-ci

on:
  push:
    branches: [main]
    paths:
      - "**.ts"
      - "**.tsx"
      - "**.json"
      - "**.jsonl"
      - "**.html"
      - "docs/**"
      - "infra/**"
      - "design/**"
      - "design/tokens.toml"
      - "package.json"
      - "bun.lock"
      - "verification/**"
      - "market/**"
      - "dsh-plugin/**"
      - "dsh-plugin-*/**"
      - ".github/workflows/**"
  # No `paths:` filter here, deliberately. Branch protection requires `market-index` and
  # `verify-changed`; a path filter that matches nothing means the workflow never triggers, the
  # check runs are never created, and the PR is stuck at "Expected — waiting for status to be
  # reported" forever (#248: a `.mailmap`-only PR could not merge). A path list can never be
  # complete — every new root-level file re-opens the hole — so PRs always trigger.
  #
  # No `branches:` filter either (#261, same bug one dimension over): a PR targeting a feature
  # branch triggered nothing, and retargeting it to main does not fire `pull_request` at all — only
  # `opened`/`synchronize`/`reopened` do — so a main-targeted PR could sit with zero check runs.
  # Any trigger-level filter that can leave a main-targeted PR unverified is the defect; the
  # expensive work is gated per job instead (`code-mode` below), so a cheap check always exists.
  pull_request:
  # Freshness cadence: the value artifacts cannot be rebuilt in CI (live inputs), but a daily run
  # still fails if the generator inputs drifted or a release tag is unregistered.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:
    inputs:
      fail_on_purpose:
        description: "Self-test: fail this run on purpose so the notify job is exercised. Dispatch it on a branch, never on main."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sportsdesk-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned parseMarketIndex validator — bump with engines.dsh / shipped harness
  HARNESS_VALIDATOR_SHA: 66491b05e3f05ad35bcdd4f6cd7ed26041d9e3db
  HARNESS_VALIDATOR_REF: 66491b05e3f05ad35bcdd4f6cd7ed26041d9e3db

jobs:
  market-index:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Opt-in self-test (#248): the `notify` job's true branch cannot be observed on a push
      # without breaking main, and inspection alone cannot rule out an event-level exclusion.
      # Dispatching this on a branch makes a needed job fail on purpose, so notify must fire.
      # Default false, and it is dispatch-only — the `inputs` context is empty for push/PR.
      - name: Deliberate failure (self-test)
        if: ${{ inputs.fail_on_purpose == true }}
        run: |
          echo "::error::fail_on_purpose=true — failing on purpose to exercise scripts/ci/notify_failure.ts"
          exit 1
      - uses: actions/checkout@v4
        with:
          # git pin tests: commit must exist in this repo
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile --no-env-file
      - name: Verify CI gates (lockfile, credentials, gitattributes)
        run: bun ./scripts/verify_ci_gates.ts
      - name: Audit harness validator pin (deepseek-harness checkout)
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.HARNESS_VALIDATOR_REF }}
          path: .ci/deepseek-harness
          fetch-depth: 1
      - name: Validate market index (format 1)
        timeout-minutes: 3
        env:
          MARKET_INDEX_HARNESS: .ci/deepseek-harness
          HARNESS_VALIDATOR_SHA: ${{ env.HARNESS_VALIDATOR_SHA }}
          REQUIRE_MARKET_INDEX: "1"
        run: |
          test "$(jq -r .version .ci/deepseek-harness/package.json)" = "0.2.2-rc.1"
          test "$(git -C .ci/deepseek-harness rev-parse HEAD)" = "$HARNESS_VALIDATOR_SHA"
          bun run test:market-index
      - name: Plugin bundle boundary check
        run: bash scripts/check-plugin-boundaries.sh
      - name: Index vs manifest audit
        run: bash scripts/audit-plugins.sh

  verify-changed:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Format check (changed files)
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: |
          rc=0
          bun fmt --check --changed="origin/${GITHUB_BASE_REF}" || rc=$?
          if [ "$rc" -eq 1 ]; then echo "::error::unformatted files (bun fmt --check)"; exit 1; fi
          if [ "$rc" -ne 0 ]; then echo "::error::bun fmt failed (exit $rc)"; exit "$rc"; fi
      - name: Install dependencies
        run: bun install --frozen-lockfile --no-env-file
      # SECURITY-ADJACENT SEAL (merge gate): profile insecure-host import allowlist — do not move to a
      # non-required job or trim without replacing the merge gate. Runs early so a later step failure
      # still leaves proof this job executed the seal on PRs touching lib/. Full suite: `code-mode` job.
      - name: Profile code-mode host import allowlist
        timeout-minutes: 2
        run: bun run check:profile-code-mode-host-seal
      - name: Build workspace contracts dist
        run: bun run --filter '@sportsdesk-ops/contracts' build
      # Baseline green on 2026-11-14: 0 vulnerabilities (180 packages) after
      # `bun audit fix` bumped @hono/node-server to 2.1.6 and overrides carried
      # got to 11.8.5 and ws to 5.2.5 (both were pinned by @ganchrowsci/gs-sdk's
      # transitive diffusion/got ranges). Blocking from here on.
      - name: Dependency audit
        timeout-minutes: 2
        run: bun run audit:deps
      - name: Type check
        timeout-minutes: 3
        run: bun run typecheck
      - name: Lint
        timeout-minutes: 3
        run: bun run lint:check
      - name: Derived contract pins
        timeout-minutes: 2
        run: bun run check:derived-contracts
      - name: Bun docs & shape manifest baselines
        timeout-minutes: 3
        run: bun run bun:docs-mcp surfaces --check tests/bun_docs_surface_baseline.json && bun scripts/bun_shape_contracts.ts --check && bun test tests/bun_shapes_manifest.test.ts tests/bun_shapes_coverage.test.ts tests/language_coverage.test.ts
      # Two cheap gates that ran only on main and turned it red after green PRs
      # (2026-11-14: the innerHTML sink scan in #188 and the bundled VPS tree in
      # #189). Both take seconds, so PRs can check them too.
      - name: Main-gate smoke (innerHTML sinks + VPS tree)
        timeout-minutes: 2
        run: bun bin/check-innerhtml.ts && bun test tests/dashboard_credentials.test.ts
      # The docs contract (fabricated contract, freshness, headers, dist parity) lived only in
      # `verify`, which is skipped on pull requests — so a docs-heavy PR merged unvalidated and
      # the failure surfaced in the nightly run hours later (#271). It costs seconds.
      # The projection's staleness check needs the f402 artifact, which is gitignored, so CI can
      # never run it. This checks what a PR CAN break: the committed projection still carries the
      # population block and no customer-identifying key (#279).
      # Four committed synthetic rows. Permitted-keys-only means a new field is a decision in
      # check_demo_fixture.ts, not something that rides along (#283).
      - name: Demo customer fixture policy
        timeout-minutes: 1
        run: bun run scripts/check_demo_fixture.ts

      - name: Rankings summary projection policy
        timeout-minutes: 1
        run: bun run scripts/project_rankings_summary.ts --policy

      - name: "Docs gates (verify_docs: fabricated-contract, freshness, headers, dist)"
        timeout-minutes: 2
        run: bun run verify:docs

      - name: Bun test changed files
        run: bun run test:changed
      - name: Changed dsh-plugin bundles (verify-load)
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/ci/test-changed-plugins.sh
      - name: Cache NSH v0.5.0 toolchain & TypeScript 7 cache
        uses: actions/cache@v4
        with:
          path: |
            .agents/tools/nsh
            .agents/tools/nsh-cache
          key: nsh-v0.5.0-f4d68f7-${{ runner.os }}-${{ runner.arch }}
      - name: Changed NSH Desk package (pinned v0.5.0 check + build + headless test + web + signed .nshpkg)
        timeout-minutes: 5
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/ci/test-changed-nsh.sh

  lint-native:
    # Native `bun lint` ships in the canary channel, not in the pinned 1.4.4 runtime (and the
    # migrated `"lint": "bun lint"` script recurses there). This job is the parity check against
    # .oxlintrc.json; the repo pin and every other job stay on .bun-version.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary
      - name: Install dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile --no-env-file
      - name: Native lint (oxlint config parity)
        timeout-minutes: 3
        run: bun run lint:native
      - name: Native lint (type-aware)
        timeout-minutes: 5
        run: bun run lint:native:type-aware

  code-mode:
    # Property-based + mutation gate for the Code Mode profile tools. Unlike the PR ratchet this
    # runs the full sequential gate on both PRs and main: mutation survivors are the regression.
    #
    # PRs into a branch other than main (stacked PRs) skip it. The trigger is no longer filtered by
    # branch (#261), so the one expensive job gates itself on the base rather than costing ~90s on
    # every stacked push; `market-index` and `verify-changed` still run there, so the PR has checks.
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Decide whether this change can affect Code Mode
        id: scope
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: bash scripts/ci/changed-code.sh
      - name: Install dependencies
        if: steps.scope.outputs.run == 'true'
        run: bun install --frozen-lockfile --no-env-file
      - name: Code Mode gates (freeze, property tests, mutation, guest probe)
        if: steps.scope.outputs.run == 'true'
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          # On a push, origin/main == HEAD in the checkout; the gate falls back to this SHA (or HEAD^).
          GITHUB_EVENT_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: bun run ci:code-mode
      - name: Upload mutation report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: reports/mutation
          if-no-files-found: warn

  verify:
    # Full ratchet on main (and unattended cadence), not on pull requests — PRs use verify-changed.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sportsdesk_ci
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # No continue-on-error: masking a failure reported this job green while every later
    # gate was skipped (2026-11-09: format:check failed; typecheck, lint, docs, route
    # surface, secrets and schema never ran). The chain is documented as stopping at the
    # first failure, so a red step must be a red run.
    continue-on-error: false
    steps:
      - uses: actions/checkout@v4
        with:
          # audit:release compares docs/releases.json against the tags that exist. A shallow
          # clone does not carry the older docs-v* tags, even with fetch-tags, and the repo is
          # small enough that full history is cheaper than a false failure.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        timeout-minutes: 5
        run: bun install --frozen-lockfile --no-env-file
      - name: Build workspace contracts dist
        run: bun run --filter '@sportsdesk-ops/contracts' build
      - name: "Pinned CDN asset drift (live origins; scheduled/unattended runs)"
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 4
        run: bun run pin:cdn
      - name: Manager boot oracle runtime + slice guard
        timeout-minutes: 2
        run: bun run verify:manager-oracle-slices
      - name: Manager oracle gates (exit 10 BLOCKED ok, 1 FAILED)
        timeout-minutes: 2
        run: bash scripts/ci/run-manager-oracle-gates.sh
      - name: HAR redaction verifier (synthetic green/red)
        timeout-minutes: 2
        run: bun test lib/f402_har_redaction_proof_verify.test.ts
      - name: Check formatting
        timeout-minutes: 3
        run: bun run format:check
      - name: Type check
        timeout-minutes: 3
        run: bun run typecheck
      - name: Lint
        timeout-minutes: 3
        run: bun run lint:check
      - name: Derived contract pins
        timeout-minutes: 2
        run: bun run check:derived-contracts
      - name: Docs invariants (spec honesty, evidence parity, portal, negative coverage)
        timeout-minutes: 3
        run: bun run test:docs
      - name: "Docs gates (verify_docs: fabricated-contract, freshness, headers, dist)"
        timeout-minutes: 5
        run: bun run verify:docs
      - name: "Route surface (served = ledger = spec)"
        timeout-minutes: 2
        run: bun run check:route-surface
      - name: "No credentials in tracked files"
        timeout-minutes: 2
        run: bun run check:secrets
      - name: "Every secret-like env var is in lib/secret_manifest.ts"
        timeout-minutes: 2
        run: bun run audit:secrets
      - name: "Bun docs coverage baseline (catalog vs bun-docs MCP audit, offline)"
        timeout-minutes: 2
        run: bun run bun:docs-mcp surfaces --check tests/bun_docs_surface_baseline.json
      - name: "Ops audit (release registry, archive provenance)"
        timeout-minutes: 2
        run: bun run audit:ops
      - name: "Artifact freshness (generator inputs unchanged since regeneration)"
        timeout-minutes: 2
        run: bun run artifacts:lock
      - name: "Markdown & Task Rendering Gate (Bun.markdown HTML/ANSI/Zstd)"
        timeout-minutes: 2
        run: bun run tasks:render --no-color --columns 0 >/dev/null && bun run docs:render
      - name: Token SSOT Zero-Drift Gate
        timeout-minutes: 3
        run: bun run gen:tokens:gate
      - name: RequestInit Wire Linter Gate
        timeout-minutes: 3
        run: bun bin/check-fetch-init.ts --verbose
      - name: "Safe innerHTML + external-asset SRI gate"
        timeout-minutes: 3
        run: bun bin/check-innerhtml.ts --verbose
      - name: "Signal Honesty Linter Gate"
        timeout-minutes: 3
        run: bun bin/check-signal-honesty.ts --verbose
      - name: Cache NSH v0.5.0 toolchain & TypeScript 7 cache
        uses: actions/cache@v4
        with:
          path: |
            .agents/tools/nsh
            .agents/tools/nsh-cache
          key: nsh-v0.5.0-f4d68f7-${{ runner.os }}-${{ runner.arch }}
      - name: "Native Shell Desk Gate (pinned nsh v0.5.0 f4d68f7 doctor + verify-loop + web + signed .nshpkg)"
        timeout-minutes: 5
        run: bash scripts/ci/install-nsh.sh && bun run nsh:doctor && bun run nsh:verify
      - name: Schema gate (snapshot parity, fixture drift, gauntlet, EOD smoke)
        timeout-minutes: 5
        env:
          CI: "true"
        run: bun run schema:gate
      - name: Audit harness validator pin (deepseek-harness checkout)
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ env.HARNESS_VALIDATOR_REF }}
          path: .ci/deepseek-harness
          fetch-depth: 1
      - name: Validate market index (format 1)
        timeout-minutes: 3
        env:
          MARKET_INDEX_HARNESS: .ci/deepseek-harness
          HARNESS_VALIDATOR_SHA: ${{ env.HARNESS_VALIDATOR_SHA }}
          REQUIRE_MARKET_INDEX: "1"
        run: |
          test "$(jq -r .version .ci/deepseek-harness/package.json)" = "0.2.2-rc.1"
          test "$(git -C .ci/deepseek-harness rev-parse HEAD)" = "$HARNESS_VALIDATOR_SHA"
          bun run test:market-index
      - name: Execute Full Verification Test Suite
        timeout-minutes: 5
        run: bun test tests/ --parallel --reporter=junit --reporter-outfile=junit-report.xml
      - name: "PostgreSQL Integration Test Suite (test:db)"
        timeout-minutes: 3
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: sportsdesk_ci
          PGPASSWORD: ci_test_password
          PGDATABASE: sportsdesk_test
          REQUIRE_DB_TESTS: "1"
        run: bun run test:db
      - name: Colocated capture tests
        timeout-minutes: 2
        run: bun test scripts/capture/webview.test.ts scripts/capture/cookies.test.ts
      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: junit-report.xml

  notify:
    # Pages the desk when this run fails (#248). Zero watchers and one collaborator means a red
    # check reaches nobody until someone opens the PR.
    #
    # `failure()` is true only when a needed job actually failed. A run superseded by the
    # concurrency group is `cancelled` and a job that did not apply is `skipped`; neither reaches
    # here, so this does not page for pushes that were already replaced.
    #
    # Draft PRs are filtered inside the script rather than here (`IS_DRAFT`), because a draft is
    # the author declaring "not ready for review or action" and paging on it would contradict the
    # state they recorded. Keeping the decision in the script keeps it unit-tested.
    if: failure()
    needs: [market-index, verify-changed, code-mode, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Deliberately no `bun install`: the cases this reports on include a broken lockfile or a
      # bad dependency pin, and the notifier must run when the install is what failed.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Notify the desk
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: bun run scripts/ci/notify_failure.ts
