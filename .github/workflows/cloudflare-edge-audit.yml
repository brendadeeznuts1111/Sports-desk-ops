name: Cloudflare edge audit (read-only)

on:
  workflow_dispatch:
    inputs:
      live:
        description: "Query Cloudflare with the read-only audit credential"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  audit:
    name: Validate DNS/Tunnel audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run offline synthetic regression tests
        run: bun test tests/cloudflare_edge_audit.test.ts
      - name: Require read-only credentials for live audit
        if: inputs.live
        env:
          CLOUDFLARE_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_AUDIT_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configure the dedicated read-only CLOUDFLARE_AUDIT_TOKEN secret and CLOUDFLARE_ACCOUNT_ID repository variable."
            exit 2
          fi
          bun scripts/cloudflare/edge_audit.ts
