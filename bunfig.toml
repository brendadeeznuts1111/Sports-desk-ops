# Preserve the repository's existing Prettier-compatible formatting.
# https://bun.com/docs/runtime/bunfig#style-options
[fmt]
printWidth = 80
tabWidth = 2
useTabs = false
semi = true
singleQuote = false
ignorePatterns = [
  # Minified portal oracle slices — never `bun fmt` (collides with slicer output).
  "verification/manager-boot-oracle/extracted/**/*.min.js",
  # Pinned portal bundles: manifest.json pins their exact bytes.
  "verification/manager-boot-oracle/pinned/*.js",
  "tests/fixtures/**/*.golden.ast.json5",
  "tests/fixtures/**/*.golden.json",
  "tests/fixtures/fantasy402-sport-catalog-*.json",
  # Generated artifacts: the poller/generators own their shape.
  "dist/**",
  "scratch/**",
  "docs/graph-live-feed.json",
  "docs/backtest-4wk-cfb-nba.json",
  "docs/assets/pipeline-artifacts-metadata.json",
  "docs/combo-uniqueness.json",
  "docs/cross-domain-bridge.json",
  # Compact on purpose: 2.2k agents stay ~94 KB instead of ~220 KB pretty-printed.
  "data/agent-tree.json",
  # Same reason, same generator: 2,465 agents, 122 KB compact vs 228 KB pretty.
  "data/agent-index.json",
  # Tool-owned: `statechart` writes this report verbatim (it puts no blank line under a
  # heading), so formatting it only makes the next gate run dirty the tree again.
  "verification/gen-tokens-zero-drift-gate/report.md",
  "verification/gen-tokens-zero-drift-gate/out/**",
]

# Install keys (linker, globalStore, cache.dir, frozenLockfile, minimumReleaseAge) are owned by the
# machine config at ~/.bunfig.toml. Setting them here would override that SSOT, so they stay out.

# Native Bun lint (Bun 1.5+). Bun 1.4.4 accepts but ignores this section; the enforced
# gate is `bun run lint:check` (oxlint 1.90 + oxlint-tsgolint). Keep this block aligned
# with .oxlintrc.json.
#
# `typeAware` stays off deliberately: the full type-aware pass currently reports 605
# warnings (166 no-floating-promises), and `bun check` has 11 unrelated errors.
[lint]
ignorePatterns = [
  "**/node_modules/**",
  "verification/manager-boot-oracle/pinned/**",
  "scratch/**",
  "Scratch/**",
  "dist/**",
]

[lint.categories]
correctness = "warn"

[lint.rules]
"@typescript-eslint/no-explicit-any" = "error"
"@typescript-eslint/no-require-imports" = "error"
"preserve-caught-error" = "warn"

[run]
# Exit automatically when the parent process dies (macOS kqueue EVFILT_PROC/NOTE_EXIT)
# and stop-verify-kill all spawned descendants (including headless Bun.WebView).
noOrphans = true

[console]
# How many levels `console.log` expands before printing `[Object ...]` (Bun's default is 2). 8 keeps
# nested report objects (a secrets row with its mention counts and aliases is 7 deep) readable.
# `bun --console-depth=N` overrides it. Plain `Bun.inspect` is not affected by this setting.
depth = 8
