# Preserve the repository's existing Prettier-compatible formatting. Where Prettier would
# change meaning (CSS escapes/selectors, Handlebars doctype/script comments), bun fmt keeps
# the source; tests/bun_fmt_semantics.test.ts pins those cases, and CI runs
# `bun fmt --debug-check` on changed files (PRs) and the whole tree (verify).
# https://bun.com/docs/runtime/bunfig#style-options
[fmt]
printWidth = 80
tabWidth = 2
useTabs = false
semi = true
singleQuote = false
ignorePatterns = [
  # Minified portal oracle slices — `bun fmt` skips `*.min.js` on directory scans,
  # and this entry also blocks explicit-path runs (`bun fmt verification/...`).
  "verification/manager-boot-oracle/extracted/**/*.min.js",
  # Pinned portal bundles: manifest.json pins their exact bytes.
  "verification/manager-boot-oracle/pinned/*.js",
  "tests/fixtures/**/*.golden.ast.json5",
  "tests/fixtures/**/*.golden.json",
  "tests/fixtures/fantasy402-sport-catalog-*.json",
  # Generated artifacts (`dist/` and `scratch/` are already skipped via `.gitignore`):
  # the poller/generators own their shape.
  "docs/graph-live-feed.json",
  "docs/backtest-4wk-cfb-nba.json",
  "docs/assets/pipeline-artifacts-metadata.json",
  "docs/combo-uniqueness.json",
  "docs/cross-domain-bridge.json",
  # Compact on purpose: 2.2k agents stay ~94 KB instead of ~220 KB pretty-printed.
  "data/agent-tree.json",
  # Same reason, same generator: 2,465 agents, 122 KB compact vs 228 KB pretty.
  "data/agent-index.json",
  # Generator-owned: `--check` compares exact bytes, and the formatter rewrites flag arrays.
  "data/profile-snapshot.json",
  # Tool-owned: `statechart` writes this report verbatim (it puts no blank line under a
  # heading), so formatting it only makes the next gate run dirty the tree again.
  "verification/gen-tokens-zero-drift-gate/report.md",
  "verification/gen-tokens-zero-drift-gate/out/**",
]

# The image/asset diagnostics feature opts into import sorting; the rest of the repo keeps
# Prettier-compatible defaults so adopting it stays a contained diff. `sortImports` groups
# imports, sorts `{ }` names and merges duplicate specifiers from the same module.
[[fmt.overrides]]
files = [
  "lib/asset_baseline.ts",
  "lib/bun_image_*.ts",
  "lib/bun_thumbnail*.ts",
  "lib/format_bytes.ts",
  "lib/image_header.ts",
  "lib/image_limits.ts",
  "lib/inspect_diagnostics.ts",
  "lib/inspect_redactor.ts",
  "packages/ui/src/format_bytes.ts",
  "packages/ui/src/panels/BunAssetsTabPanel.tsx",
  "scripts/bun_lint.ts",
  "scripts/image_asset_*.ts",
  "tests/bun_lint*.test.ts",
  "tests/bun_thumbnail*.test.ts",
  "tests/dashboard_bun_assets_panel.test.tsx",
  "tests/dashboard_image_asset_diagnostics.test.ts",
  "tests/image_*.test.ts",
  "tests/inspect_ansi_diagnostics.test.ts",
]
options = { sortImports = true }

# Install keys (linker, globalStore, cache.dir, frozenLockfile, minimumReleaseAge,
# minimumReleaseAgeExcludes) are owned by the machine config at ~/.bunfig.toml. Setting one here
# would override that SSOT, so they stay out:
# `pm:doctor` fails the "project bunfig" check when one is present (`lib/pm_policy.ts`
# MACHINE_OWNED_INSTALL_KEYS). Non-machine keys are safe and are pinned here.
#
# `exact` makes `bun add` write the resolved version instead of a caret range, matching the
# exact-pin policy the root manifest already follows. `ignoreScripts` is a no-op today — the root
# `trustedDependencies` is `[]` and the root has no install lifecycle — and keeps it that way if a
# dependency or a `prepare` script is ever added. Both are project keys, not machine overrides.
[install]
exact = true
ignoreScripts = true

# Native Bun lint config. Only the native linter reads it. That linter exists on the 1.4.5
# canary (`bun lint --no-script`), which the CI `lint-native` job runs, and is expected in
# Bun 1.5+; it is not on the pinned 1.4.4, which parses this section without error but has
# no command that uses it. The enforced local gate remains
# `bun run lint:check` (oxlint 1.90 + oxlint-tsgolint). Keep this block aligned with
# .oxlintrc.json.
#
# `typeAware` stays off deliberately: the full type-aware pass currently reports 605
# warnings (166 no-floating-promises), and `bun check` has 11 unrelated errors.
[lint]
ignorePatterns = [
  "**/node_modules/**",
  "verification/manager-boot-oracle/pinned/**",
  "scratch/**",
  "Scratch/**",
  "dist/**",
]

[lint.categories]
correctness = "warn"

# [[lint.overrides]] — measured 2026-11-11 on a canary build (1.4.4-canary.1); not observable on
# the pinned 1.4.4, which has no native linter. Measured before any override exists here.
# Add the first one only after re-checking these rows; the dialect differs from minimatch.
#   files         union of independent matchers, Bun.Glob syntax (braces, [ab], @(a|b) all work),
#                 anchored to this file's directory rather than the invocation cwd.
#   `!p` in files matches paths that do NOT match p, and the list is a union — so a negation can
#                 only broaden: ["src/**", "!src/a.ts"] still applies to src/a.ts. It is not
#                 subtraction; with a single entry ["!src/a.ts"] it means "every other file".
#   excludeFiles  the only subtractive operator; same syntax, applied after files.
#   dot           no gate: lint matches an already-enumerated list, so `**/*` reaches .config/.
# Re-probe when bumping Bun: a dialect change is invisible to config hashing.

[lint.rules]
# Off by default upstream: `with {}` is a leftover shell or a placeholder for a
# missing `type`. Bun 1.4.4 has no native `bun lint` command (it resolves to the
# package script and `--no-script` does not bypass it), so locally oxlint cannot
# enforce this rule and tests/module_attributes.test.ts covers the intent; the CI
# `lint-native` job on the canary runtime enforces it natively.
"unicorn/require-module-attributes" = "error" # https://bun.com/docs/lint/rules/unicorn/require-module-attributes
# Enforced today by oxlint 1.90 (.oxlintrc.json), which ships the same unicorn rule. Measured
# with a probe: `.map(fn).flat()` and `.flat(1)` are reported and fixed to `.flatMap(fn)`;
# `.flat(2)`/`.flat(Infinity)` are not (different semantics), and this repo has zero hits.
"unicorn/prefer-array-flat-map" = "error" # https://bun.com/docs/lint/rules/unicorn/prefer-array-flat-map
"eqeqeq" = ["error", "smart"] # same policy as .oxlintrc.json; "smart" keeps the `x == null` guards
"@typescript-eslint/no-explicit-any" = "error"
"@typescript-eslint/no-require-imports" = "error"
"preserve-caught-error" = "warn"

# Type-aware gate: mirror .oxlintrc.type-aware.json, whose correctness category is off and
# whose eight rules are the only type-aware errors. `bun lint --type-aware` turns on Bun's
# recommended type-aware set, so the rules this repo has not triaged are named explicitly.
"typescript/no-array-delete" = "error"
"typescript/no-duplicate-type-constituents" = "error"
"typescript/no-for-in-array" = "error"
"typescript/no-meaningless-void-operator" = "error"
"typescript/no-unsafe-enum-assignment" = "error"
"typescript/no-unsafe-enum-comparison" = "error"
"typescript/no-useless-default-assignment" = "error"
"typescript/return-await" = ["error", "error-handling-correctness-only"]

# Untriaged recommended type-aware rules (canary `bun lint --type-aware`, 2026-11-04):
# 215 no-base-to-string, 166 no-floating-promises, 74 restrict-template-expressions,
# 40 no-redundant-type-constituents, 10 require-array-sort-compare, 8 await-thenable,
# 6 no-misused-spread, 6 no-implied-eval, 4 unbound-method, 1 no-unsafe-unary-minus.
# Turning one on here (or fixing it) is the ratchet; the counts are the cleanup size.
"@typescript-eslint/no-base-to-string" = "off"
"@typescript-eslint/no-floating-promises" = "off"
"@typescript-eslint/restrict-template-expressions" = "off"
"@typescript-eslint/no-redundant-type-constituents" = "off"
"@typescript-eslint/require-array-sort-compare" = "off"
"@typescript-eslint/await-thenable" = "off"
"@typescript-eslint/no-misused-spread" = "off"
"@typescript-eslint/no-implied-eval" = "off"
"@typescript-eslint/unbound-method" = "off"
"@typescript-eslint/no-unsafe-unary-minus" = "off"

[run]
# Exit automatically when the parent process dies (macOS kqueue EVFILT_PROC/NOTE_EXIT)
# and stop-verify-kill all spawned descendants (including headless Bun.WebView).
noOrphans = true

[console]
# How many levels `console.log` expands before printing `[Object ...]` (Bun's default is 2). 8 keeps
# nested report objects (a secrets row with its mention counts and aliases is 7 deep) readable.
# MEASURED 2026-11-14 on 1.4.4: `bun --console-depth=N` does NOT override it --
# this bunfig value wins, and the flag only applies when no [console].depth is in
# scope. Plain `Bun.inspect` is not affected by this setting either.
depth = 8

[test]
# Every key below is a Bun 1.4.4 [test] key, checked 2026-11-15 against the pinned binary in a
# scratch project by toggling each one and watching discovery or coverage output change.
# 1.4.4 does NOT warn on an unknown or misspelled [test] key, so re-check behaviour, not just
# the absence of a warning.
#
# Ignore scratch experiments, heavy fixtures, and generated gate artifacts from test scans; this
# also applies when a path is given (`bun test tests/` skips tests/fixtures/**).
# Local bare `bun test` / `bun run test` also runs the colocated tests in lib/ and scripts/; CI's
# full suite is `bun test tests/ --parallel --reporter=junit` and runs only the colocated files
# its workflow names, so a colocated-only failure shows up locally first.
pathIgnorePatterns = [
  "scratch/**",
  "Scratch/**",
  "verification/**",
  "tests/fixtures/**",
  "packages/nsh-desk/**",
  # One-off OpenAPI authoring script (`*_spec.mjs` otherwise matches Bun's test glob):
  "scripts/author_openapi_spec.mjs",
]

# Only applies with `--coverage` (no CI job passes it today): console text table plus
# coverage/lcov.info.
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
coverageSkipTestFiles = true
coveragePathIgnorePatterns = [
  "tests/**",
  "verification/**",
  "scratch/**",
  "Scratch/**",
  "dist/**",
  "docs/**",
]


