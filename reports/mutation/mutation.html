shot is committed (`data/profile-snapshot.json`) because the operator book it is derived\n * from (`data/customer-profiles.json`) is gitignored and therefore absent in CI.\n */\n\nimport { readFileSync } from \"node:fs\";\nimport { resolve } from \"node:path\";\n\nimport {\n  DEFAULT_LIMIT,\n  MAX_LIMIT,\n  type ProfileField,\n} from \"./profile_query_schema.ts\";\n\nexport { DEFAULT_LIMIT, MAX_LIMIT, type ProfileField };\n\nexport interface ProfileRecord {\n  readonly id: string;\n  readonly vol: number;\n  readonly clv: number;\n  readonly sharp: number;\n  readonly flags: readonly string[];\n}\n\nexport interface ProfileQueryRow {\n  readonly id: string;\n  readonly value: number;\n  readonly flags: readonly string[];\n  readonly sentinel: boolean;\n}\n\nexport interface ProfileQueryResult {\n  readonly field: ProfileField;\n  readonly rows: readonly ProfileQueryRow[];\n  readonly truncated: boolean;\n}\n\nexport interface ProfileSummary {\n  readonly deltaVol: number;\n  readonly deltaNet: number;\n}\n\nexport class ToolError extends Error {\n  readonly toolError = true as const;\n}\n\nexport function isToolError(value: unknown): value is ToolError {\n  return (\n    value instanceof ToolError ||\n    (typeof value === \"object\" &&\n      value !== null &&\n      (value as { toolError?: unknown }).toolError === true)\n  );\n}\n\nconst isRecord = (value: unknown): value is Record<"+"string, unknown> =>\n  typeof value === \"object\" && value !== null && !Array.isArray(value);\n\nconst finite = (value: unknown, where: string): number => {\n  if (typeof value !== \"number\" || !Number.isFinite(value)) {\n    throw new Error(`profile snapshot: ${where} is not a finite number`);\n  }\n  return value;\n};\n\nconst stringFlags = (value: unknown, where: string): readonly string[] => {\n  if (!Array.isArray(value)) {\n    throw new Error(`profile snapshot: ${where} is not a string array`);\n  }\n  const flags: string[] = [];\n  for (const flag of value) {\n    if (typeof flag !== \"string\") {\n      throw new Error(`profile snapshot: ${where} is not a string array`);\n    }\n    flags.push(flag);\n  }\n  return Object.freeze(flags);\n};\n\n/** Only own data properties are read: inherited keys and prototype traps are ignored. */\nconst ownValue = (source: Record<"+"string, unknown>, key: string): unknown =>\n  Object.hasOwn(source, key) ? source[key] : undefined;\n\n/**\n * Parse and freeze a snapshot document. Exported so the loader's rejection paths are testable\n * without shipping a malformed committed snapshot.\n */\nexport function parseProfileSnapshot(raw: unknown): readonly ProfileRecord[] {\n  if (!isRecord(raw) || !Array.isArray(raw.profiles)) {\n    throw new Error(\"profile snapshot: missing profiles array\");\n  }\n  if (raw.schemaVersion !== SNAPSHOT_SCHEMA_VERSION) {\n    throw new Error(\n      `profile snapshot: unsupported schemaVersion ${String(raw.schemaVersion)}`,\n    );\n  }\n  const seen = new Set<"+"string>();\n  const profiles = raw.profiles.map((entry, index) => {\n    if (!isRecord(entry) || typeof entry.id !== \"string\" || entry.id === \"\") {\n      throw new Error(`profile snapshot: profile #${index} has no id`);\n    }\n    if (entry.id !== entry.id.trim()) {\n      throw new Error(\n        `profile snapshot: profile #${index} id has surrounding whitespace`,\n      );\n    }\n    if (seen.has(entry.id)) {\n      throw new Error(`profile snapshot: duplicate id ${entry.id}`);\n    }\n    seen.add(entry.id);\n    return Object.freeze({\n      id: entry.id,\n      vol: finite(entry.vol, `${entry.id}.vol`),\n      clv: finite(entry.clv, `${entry.id}.clv`),\n      sharp: finite(entry.sharp, `${entry.id}.sharp`),\n      flags: stringFlags(entry.flags, `${entry.id}.flags`),\n    });\n  });\n  return Object.freeze(profiles);\n}\n\nconst SNAPSHOT_SCHEMA_VERSION = 1;\n\nconst SNAPSHOT_ENV = (process.env.PROFILE_SNAPSHOT_PATH ?? \"\").trim();\nconst SNAPSHOT_PATH: string | URL =\n  SNAPSHOT_ENV !== \"\"\n    ? resolve(SNAPSHOT_ENV)\n    : new URL(\"../data/profile-snapshot.json\", import.meta.url);\n\nlet cachedSnapshot: readonly ProfileRecord[] | undefined;\n\n/**\n * Loaded on first use: importing the module never fails on a deployment that has no snapshot, and\n * a local operator can point PROFILE_SNAPSHOT_PATH at a real projection of the book.\n */\nfunction snapshot(): readonly ProfileRecord[] {\n  if (cachedSnapshot !== undefined) return cachedSnapshot;\n  let text: string;\n  try {\n    text = readFileSync(SNAPSHOT_PATH, \"utf8\");\n  } catch {\n    throw new Error(\n      \"profile snapshot: cannot read \" +\n        String(SNAPSHOT_PATH) +\n        \" — set PROFILE_SNAPSHOT_PATH to a production snapshot\",\n    );\n  }\n  cachedSnapshot = parseProfileSnapshot(JSON.parse(text));\n  return cachedSnapshot;\n}\n\nconst FIELD_NAMES: ReadonlySet<"+"string> = new Set([\"clv\", \"vol\", \"sharp\"]);\nconst SENTINEL_PREFIX = \"SYNTH_\";\n\nconst isProfileField = (value: unknown): value is ProfileField =>\n  typeof value === \"string\" && FIELD_NAMES.has(value);\n\n/** Sentinel state is a property of the profile id, never inferred from its sort value. */\nexport function isProfileSentinel(profile: ProfileRecord): boolean {\n  return profile.id.startsWith(SENTINEL_PREFIX);\n}\n\nfunction sortValue(profile: ProfileRecord, field: ProfileField): number {\n  switch (field) {\n    case \"clv\":\n      return profile.clv;\n    case \"vol\":\n      return profile.vol;\n    case \"sharp\":\n      return profile.sharp;\n  }\n}\n\nfunction parseLimit(value: unknown): number {\n  if (value === undefined) return DEFAULT_LIMIT;\n  if (\n    typeof value !== \"number\" ||\n    !Number.isFinite(value) ||\n    !Number.isInteger(value) ||\n    value <"+"= 0\n  ) {\n    throw new ToolError(\"query_profiles: limit must be a positive integer\");\n  }\n  return value;\n}\n\n/**\n * Pure query core. Exported so properties can run over generated snapshots, not only the frozen\n * 31-row one; ` _profile: id required\");\n  }\n  const id = rawId.trim();\n  const found = snapshot().find((profile) => profile.id === id);\n  if (found === undefined) {\n    throw new ToolError(`get_profile: unknown id ${id}`);\n  }\n  return found;\n}\n\n/** Desk-book totals: the synthetic (sentinel) rows are excluded. */\nexport function getSummary(args: unknown): ProfileSummary {\n  if (args !== undefined && args !== null && !isRecord(args)) {\n    throw new ToolError(\"get_profile_summary: args must be an object\");\n  }\n  let deltaVol = 0;\n  let deltaNet = 0;\n  for (const profile of snapshot()) {\n    if (isProfileSentinel(profile)) continue;\n    deltaVol += profile.vol;\n    deltaNet += profile.clv;\n  }\n  return Object.freeze({ deltaVol, deltaNet });\n}\n\nexport const queryProfilesTool = {\n  async execute(args: unknown): Promise<"+"ProfileQueryResult> {\n    return queryProfiles(args);\n  },\n};\n\nexport const getProfileTool = {\n  async execute(args: unknown): Promise<"+"ProfileRecord> {\n    return getProfile(args);\n  },\n};\n\nexport const getSummaryTool = {\n  async execute(args: unknown): Promise<"+"ProfileSummary> {\n    return getSummary(args);\n  },\n};\n"},"lib/quickjs_code_mode.ts":{"language":"typescript","mutants":[{"id":"359","mutatorName":"BlockStatement","replacement":"{}","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":10,"line":144},"start":{"column":17,"line":140}}},{"id":"361","mutatorName":"StringLiteral","replacement":"\"\"","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":82,"line":142},"start":{"column":13,"line":142}}},{"id":"390","mutatorName":"StringLiteral","replacement":"\"\"","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":28,"line":172},"start":{"column":21,"line":172}}},{"id":"392","mutatorName":"StringLiteral","replacement":"\"Stryker was here!\"","status":"NoCoverage","static":false,"coveredBy":[],"location":{"end":{"column":46,"line":172 ery_tools.ts\";\n\nconst DEFAULT_TIMEOUT_MS = 5_000;\nconst DEFAULT_MAX_TOOL_CALLS = 100;\nconst DEFAULT_MEMORY_LIMIT_BYTES = 64 * 1024 * 1024;\nconst MIN_MEMORY_LIMIT_BYTES = 1024 * 1024;\nconst DEFAULT_MAX_STACK_BYTES = 1024 * 1024;\n/** Guest arguments are packed in the guest with this character budget before the host parses them. */\nconst MAX_ARGUMENT_CHARS = 1_000_000;\n\nlet quickJsModule: Promise<"+"QuickJSWASMModule> | undefined;\n\nconst loadQuickJS = (): Promise<"+"QuickJSWASMModule> => {\n  quickJsModule ??= getQuickJS();\n  return quickJsModule;\n};\n\ninterface GuestValue {\n  readonly handle: QuickJSHandle;\n  /** True when this call allocated the handle and the caller must dispose it. */\n  readonly owned: boolean;\n}\n\n/**\n * Marshal a host value into the guest realm as native QuickJS values (no JSON hop).\n * Exported so the boundary can be tested type-by-type without a tools round trip.\n */\nexport function toGuest(ctx: QuickJSContext, value: unknown): GuestValue {\n  if (value === null) return { handle: ctx.null, owned: false };\n  if (value === undefined) return { handle: ctx.undefined, owned: false };\n  switch (typeof value) {\n    case \"number\":\n      return { handle: ctx.newNumber(value), owned: true };\n    case \"string\":\n      return { handle: ctx.newString(value), owned: true };\n    case \"boolean\":\n      return { handle: value ? ctx.true : ctx.false, owned: false };\n    case \"object\":\n      break;\n    default:\n      throw new Error(`quickjs_code_mode: cannot marshal ${typeof value}`);\n  }\n\n  if (Array.isArray(value)) {\n    const array = ctx.newArray();\n    for (const [index, entry] of value.entries()) {\n      const child = toGuest(ctx, entry);\n      ctx.setProp(array, index, child.handle);\n      if (child.owned) child.handle.dispose();\n    }\n    return { handle: array, owned: true };\n  }\n\n  const object = ctx.newObject();\n  for (const [key, entry] of Object.entries(value as Record<"+"string, unknown>)) {\n    const child = toGuest(ctx, entry);\n    ctx.setProp(object, key, child.handle);\n    if (child.owned) child.handle.dispose();\n  }\n  return { handle: object, owned: true };\n}\n\ntype HostTool = (args: unknown) => unknown;\n\nfunction installTools(\n  ctx: QuickJSContext,\n  maxToolCalls: number,\n): readonly QuickJSHandle[] {\n  const tools: Readonly<"+"Record<"+"string, HostTool>> = {\n    query_profiles: (args) => queryProfiles(args),\n    get_profile: (args) => getProfile(args),\n    get_profile_summary: (args) => getSummary(args),\n  };\n  let calls = 0;\n\n  // Pack arguments in the guest, not the host: JSON.stringify runs under the guest's heap limit and\n  // a character budget, so a huge or deep object cannot exhaust host memory through ctx.dump. The\n  // host only parses the bounded text. (The guest probe itself still reads the realm directly.)\n  const pack = ctx.unwrapResult(\n    ctx.evalCode(\n      `(function(value) {\n        const text = JSON.stringify(value);\n        if (typeof text !== \"string\") {\n          throw new Error(\"ERR_CODE_MODE_ARGUMENT_UNSUPPORTED: arguments must be JSON-serialisable data\");\n        }\n        if (text.length > ${MAX_ARGUMENT_CHARS}) {\n          throw new Error(\"ERR_CODE_MODE_ARGUMENT_TOO_LARGE: argument exceeds the ${MAX_ARGUMENT_CHARS}-character budget\");\n        }\n        return text;\n      })`,\n      \"argument-pack.js\",\n    ),\n  );\n\n  const toolsObject = ctx.newObject();\n  for (const [name, hostTool] of Object.entries(tools)) {\n    const fn = ctx.newFunction(name, (...argHandles) => {\n      calls += 1;\n      if (calls > maxToolCalls) {\n        throw new Error(\n          `ERR_CODE_MODE_MAX_CALLS: cell exceeded the ${maxToolCalls} tool-call budget`,\n        );\n      }\n      const [first] = argHandles;\n      let args: unknown;\n      if (first === undefined) {\n        args = undefined;\n      } else {\n        const packed = ctx.callFunction(pack, ctx.undefined, first);\n        if (packed.error) {\n          const message = describeGuestError(ctx, packed.error);\n          packed.error.dispose();\n          throw new Error(`ERR_CODE_MODE_ARGUMENT_UNSUPPORTED: ${message}`);\n        }\n        const text = ctx.getString(packed.value);\n        packed.value.dispose();\n        try {\n          args = JSON.parse(text);\n        } catch {\n          throw new Error(\n            \"ERR_CODE_MODE_ARGUMENT_UNSUPPORTED: argument is not valid JSON data\",\n          );\n        }\n      }\n      const output = hostTool(args);\n      return toGuest(ctx, output).handle;\n    });\n    ctx.setProp(toolsObject, name, fn);\n    fn.dispose();\n  }\n  ctx.setProp(ctx.global, \"tools\", toolsObject);\n  toolsObject.dispose();\n  return [pack];\n}\n\n/** QuickJS error objects dump as `{}`; read name/message handles before disposing. */\nfunction describeGuestError(\n  ctx: QuickJSContext,\n  handle: QuickJSHandle,\n): string {\n  const read = (prop: string): string | null => {\n    const propHandle = ctx.getProp(handle, prop);\n    if (!propHandle) return null;\n    const value = ctx.dump(propHandle);\n    propHandle.dispose();\n    return typeof value === \"string\" ? value : null;\n  };\n  const name = read(\"name\");\n  const message = read(\"message\");\n  if (name === null && message === null) return String(ctx.dump(handle));\n  return `${name ?? \"Error\"}: ${message ?? \"\"}`.trim();\n}\n\ntype SettledGuestPromise =\n  { readonly value: QuickJSHandle } | { readonly error: QuickJSHandle };\n\nexport interface GuestCellOptions {\n  /** Wall-clock budget for the cell; the guest is interrupted when it expires. */\n  readonly timeoutMs?: number;\n  /** Maximum guest -> host tool calls in one cell (default 100). */\n  readonly maxToolCalls?: number;\n  /** QuickJS heap ceiling in bytes (default 64 MiB, minimum 1 MiB). */\n  readonly memoryLimitBytes?: number;\n}\n\nconst positiveOr = (value: number | undefined, fallback: number): number =>\n  value !== undefined && Number.isFinite(value) && value > 0 ? value : fallback;\n\n/**\n * Execute a cell in a fresh QuickJS realm and return its value as a host value.\n * The cell is the body of a function: `return tools.query_profiles({...})`.\n */\nexport async function runGuestCell(\n  source: string,\n  options: GuestCellOptions = {},\n): Promise<"+"unknown> {\n  const timeoutMs = positiveOr(options.timeoutMs, DEFAULT_TIMEOUT_MS);\n  const maxToolCalls = positiveOr(options.maxToolCalls, DEFAULT_MAX_TOOL_CALLS);\n  const memoryLimitBytes = Math.max(\n    MIN_MEMORY_LIMIT_BYTES,\n    positiveOr(options.memoryLimitBytes, DEFAULT_MEMORY_LIMIT_BYTES),\n  );\n\n  const QuickJS = await loadQuickJS();\n  const runtime = QuickJS.newRuntime();\n  runtime.setMemoryLimit(memoryLimitBytes);\n  runtime.setMaxStackSize(DEFAULT_MAX_STACK_BYTES);\n  runtime.setInterruptHandler(\n    shouldInterruptAfterDeadline(Date.now() + timeoutMs),\n  );\n  const ctx = runtime.newContext();\n  let cleanup: readonly QuickJSHandle[] = [];\n  try {\n    cleanup = installTools(ctx, Math.floor(maxToolCalls));\n    const result = ctx.evalCode(\n      `(async function(){\\n${source}\\n})()`,\n      \"cell.js\",\n    );\n    if (result.error) {\n      const message = describeGuestError(ctx, result.error);\n      result.error.dispose();\n      throw new Error(`quickjs_code_mode: guest cell failed: ${message}`);\n    }\n\n    // A cell may await. resolvePromise installs guest then-callbacks, but the guest job queue must\n    // be pumped for them to run; a promise that never settles is bounded by a host deadline (the\n    // interpreter is idle then, so the interrupt handler cannot fire).\n    const outcomes: SettledGuestPromise[] = [];\n    const settling = ctx.resolvePromise(result.value);\n    settling.then(\n      (outcome) => {\n        outcomes.push(outcome);\n      },\n      () => {\n        // A late rejection after the runtime is disposed is expected on the deadline path.\n      },\n    );\n    const deadline = Date.now() + timeoutMs + 250;\n    try {\n      while (outcomes.length === 0) {\n        const jobs = runtime.executePendingJobs();\n        if (\"error\" in jobs && jobs.error !== undefined) {\n          const message = describeGuestError(ctx, jobs.error);\n          jobs.error.dispose();\n          throw new Error(`quickjs_code_mode: guest cell failed: ${message}`);\n        }\n        await Bun.sleep(1);\n        if (outcomes.length === 0 && Date.now() > deadline) {\n          throw new Error(\n            `quickjs_code_mode: guest cell exceeded ${timeoutMs}ms`,\n          );\n        }\n      }\n    } finally {\n      result.value.dispose();\n    }\n    const settled = outcomes[0];\n    if (settled === undefined) {\n      throw new Error(\"quickjs_code_mode: guest cell promise did not settle\");\n    }\n    if (\"error\" in settled) {\n      const message = describeGuestError(ctx, settled.error);\n      settled.error.dispose();\n      throw new Error(`quickjs_code_mode: guest cell failed: ${message}`);\n    }\n    let value: unknown;\n    try {\n      value = ctx.dump(settled.value);\n    } finally {\n      settled.value.dispose();\n    }\n    if (typeof value === \"function\" || typeof value === \"symbol\") {\n      throw new Error(\n        \"quickjs_code_mode: guest cell returned a value that cannot cross the boundary\",\n      );\n    }\n    return value;\n  } finally {\n    for (const handle of cleanup) handle.dispose();\n    ctx.dispose();\n    runtime.dispose();\n  }\n}\n"}},"schemaVersion":"1.0","thresholds":{"high":80,"low":60,"break":60},"testFiles":{"tests/code_mode/oracle.arguments.test.ts":{"tests":[{"id":"0","name":"tests/code_mode/oracle.arguments.test.ts > oracle argument semantics > inherited properties are not arguments","location":{"start":{"column":1,"line":41}}},{"id":"1","name":"tests/code_mode/oracle.arguments.test.ts > oracle argument semantics > reads field once","location":{"start":{"column":1,"line":7}}},{"id":"2","name":"tests/code_mode/oracle.arguments.test.ts > oracle argument semantics > reads limit once and derives truncation from that read","location":{"start":{"column":1,"line":25}}},{"id":"3","name":"tests/code_mode/oracle.arguments.test.ts > oracle argument semantics > the invariant checker ignores inherited keys too","location":{"start":{"column":1,"line":59}}}],"source":"import { describe, expect, test } from \"bun:test\";\n\nimport { assertQueryInvariants, oracleQuery } from \"./oracle.ts\";\n\ndescribe(\"oracle argument semantics\", () => {\n  test(\"reads field once\", () => {\n    let reads = 0;\n    const args = {\n      get field() {\n        reads += 1;\n        return reads === 1 ? \"clv\" : \"bogus\";\n      },\n    };\n    const outcome = oracleQuery(args);\n    expect(reads).toBe(1);\n    expect(outcome.ok).toBe(true);\n    if (!outcome.ok) return;\n    expect(outcome.result.field).toBe(\"clv\");\n    expect(outcome.result.rows.every((row) => Number.isFinite(row.value))).toBe(\n      true,\n    );\n  });\n\n  test(\"reads limit once and derives truncation from that read\", () => {\n    let reads = 0;\n    const args = {\n      field: \"clv\",\n      get limit() {\n        reads += 1;\n        return reads === 1 ? 1 : 501;\n      },\n    };\n    const outcome = oracleQuery(args);\n    expect(reads).toBe(1);\n    if (!outcome.ok) throw new Error(\"expected a valid query\");\n    expect(outcome.result.truncated).toBe(false);\n    expect(outcome.result.rows).toHaveLength(1);\n  });\n\n  test(\"inherited properties are not arguments\", () => {\n    const inherited = Object.create({\n      field: \"clv\",\n      limit: 1,\n      includeSentinels: true,\n    }) as Record<"+"string, unknown>;\n    expect(oracleQuery(inherited).ok).toBe(false);\n\n    const args = Object.assign(\n      Object.create({ limit: 1, includeSentinels: true }),\n      { field: \"vol\" },\n    );\n    const outcome = oracleQuery(args);\n    if (!outcome.ok) throw new Error(\"expected a valid query\");\n    expect(outcome.result.rows.some((row) => row.sentinel)).toBe(false);\n    expect(outcome.result.rows.length).toBeGreaterThan(1);\n  });\n\n  test(\"the invariant checker ignores inherited keys too\", () => {\n    const args = Object.create({ field: \"clv\" }) as Record<"+"string, unknown>;\n    const result = { field: \"clv\", truncated: false, rows: [] };\n    expect(() => assertQueryInvariants(result, args)).toThrow(\n      /echo the requested field/,\n    );\n  });\n});\n"},"tests/code_mode/profile_query.differential.test.ts":{"tests":[{"id":"4","name":"tests/code_mode/profile_query.differential.test.ts > differential oracle: SQLite vs queryProfiles > both engines agree for arbitrary valid requests","location":{"start":{"column":1,"line":55}}},{"id":"5","name":"tests/code_mode/profile_query.differential.test.ts > differential oracle: SQLite vs queryProfiles > over-limit requests clamp to MAX_LIMIT in both engines","location":{"start":{"column":1,"line":93}}}],"source":"import { Database } from \"bun:sqlite\";\nimport { afterAll, describe, expect, test } from \"bun:test\";\nimport fc from \"fast-check\";\n\nimport {\n  MAX_LIMIT,\n  queryProfiles,\n  type ProfileField,\n} from \"../../lib/profile_query_tools.ts\";\nimport { snapshotProfiles } from \"./oracle.ts\";\n\nconst NUM_RUNS = (() => {\n  const raw = Number(process.env.FAST_CHECK_NUM_RUNS);\n  return Number.isInteger(raw) && raw > 0 ? raw : 100;\n})();\n\nconst seed = Number(process.env.FAST_CHECK_SEED);\nif (process.env.FAST_CHECK_SEED !== undefined && Number.isInteger(seed)) {\n  fc.configureGlobal({ seed });\n}\n\n/**\n * Independent engine: SQLite orders the same rows with its own COLLATE BINARY / REAL semantics.\n * Agreement across two implementations is stronger evidence than the JS oracle matching itself.\n */\nconst db = new Database(\":memory:\");\ndb.run(\n  \"CREATE TABLE profiles (id TEXT PRIMARY KEY, vol REAL, clv REAL, sharp REAL, flags TEXT, sentinel INTEGER)\",\n);\nconst insert = db.prepare(\n  \"INSERT INTO profiles (id, vol, clv, sharp, flags, sentinel) VALUES (?, ?, ?, ?, ?, ?)\",\n);\nfor (const profile of snapshotProfiles()) {\n  insert.run(\n    profile.id,\n    profile.vol,\n    profile.clv,\n    profile.sharp,\n    JSON.stringify(profile.flags),\n    profile.id.startsWith(\"SYNTH_\") ? 1 : 0,\n  );\n}\n\nconst FIELDS: readonly ProfileField[] = [\"clv\", \"vol\", \"sharp\"];\nconst SQL_FIELD: Readonly<"+"Record<"+"ProfileField, string>> = {\n  clv: \"clv\",\n  vol: \"vol\",\n  sharp: \"sharp\",\n};\n\nafterAll(() => db.close());\n\ndescribe(\"differential oracle: SQLite vs queryProfiles\", () => {\n  test(\"both engines agree for arbitrary valid requests\", () => {\n    fc.assert(\n      fc.property(\n        fc.constantFrom(...FIELDS),\n        fc.integer({ min: 1, max: MAX_LIMIT }),\n        fc.boolean(),\n        (field, limit, includeSentinels) => {\n          const rows = db\n            .query(\n              `SELECT id, ${SQL_FIELD[field]} AS value, flags, sentinel\n               FROM profiles\n               WHERE (? = 1 OR sentinel = 0)\n               ORDER BY value DESC, id ASC\n               LIMIT ?`,\n            )\n            .all(includeSentinels ? 1 : 0, limit) as {\n            id: string;\n            value: number;\n            flags: string;\n            sentinel: number;\n          }[];\n\n          const result = queryProfiles({ field, limit, includeSentinels });\n          expect(result.rows).toEqual(\n            rows.map((row) => ({\n              id: row.id,\n              value: row.value,\n              flags: JSON.parse(row.flags) as string[],\n              sentinel: row.sentinel === 1,\n            })),\n          );\n          expect(result.truncated).toBe(false);\n        },\n      ),\n      { numRuns: NUM_RUNS },\n    );\n  });\n\n  test(\"over-limit requests clamp to MAX_LIMIT in both engines\", () => {\n    const result = queryProfiles({ field: \"vol\", limit: MAX_LIMIT + 25 });\n    const rows = db\n      .query(\n        \"SELECT id FROM profiles WHERE sentinel = 0 ORDER BY vol DESC, id ASC LIMIT ?\",\n      )\n      .all(MAX_LIMIT) as { id: string }[];\n    expect(result.rows.map((row) => row.id)).toEqual(rows.map((row) => row.id));\n    expect(result.truncated).toBe(true);\n  });\n});\n"},"tests/code_mode/profile_query.parser.test.ts":{"tests":[{"id":"6","name":"tests/code_mode/profile_query.parser.test.ts > snapshot loader rejection paths > rejects a document without a profiles array","location":{"start":{"column":1,"line":32}}},{"id":"7","name":"tests/code_mode/profile_query.parser.test.ts > snapshot loader rejection paths > rejects an unknown or missing schema version","location":{"start":{"column":1,"line":38}}},{"id":"8","name":"tests/code_mode/profile_query.parser.test.ts > snapshot loader rejection paths > rejects duplicate ids","location":{"start":{"column":1,"line":63}}},{"id":"9","name":"tests/code_mode/profile_query.parser.test.ts > snapshot loader rejection paths > rejects ids with surrounding whitespace","location":{"start":{"column":1,"line":54}}},{"id":"10","name":"tests/code_mode/profile_query.parser.test.ts > snapshot loader rejection paths > rejects non-finite numeric fields with the profile in the message","location":{"start":{"column":1,"line":69}}},{"id":"11","name":"tests/code_mode/profile_query.parser.test.ts > snapshot loader rejection paths > rejects non-string flags","location":{"start":{"column":1,"line":81}}},{"id":"12","name":"tests/code_mode/profile_query.parser.test.ts > snapshot loader rejection paths > rejects profiles without a usable id","location":{"start":{"column":1,"line":48}}},{"id":"13","name":"tests/code_mode/profile_query.parser.test.ts > snapshot loader success path > freezes records and their flags","location":{"start":{"column":1,"line":92}}}],"source":"import { describe, expect, test } from \"bun:test\";\n\nimport { parseProfileSnapshot } from \"../../lib/profile_query_tools.ts\";\n\nconst profile = (\n  overrides: Record<"+"string, unknown> = {},\n): Record<"+"string, unknown> => ({\n  id: \"P1\",\n  vol: 10,\n  clv: 20,\n  sharp: 30,\n  flags: [\"A\"],\n  ...overrides,\n});\n\nconst snapshot = (profiles: unknown): unknown => ({\n  schemaVersion: 1,\n  profiles,\n});\n\nconst failure = (raw: unknown): string => {\n  try {\n    parseProfileSnapshot(raw);\n  } catch (error) {\n    return error instanceof Error ? error.message : String(error);\n  }\n  throw new Error(\"parseProfileSnapshot did not throw\");\n};\n\ndescribe(\"snapshot loader rejection paths\", () => {\n  test(\"rejects a document without a profiles array\", () => {\n    for (const raw of [undefined, null, 42, \"x\", {}, { profiles: \"x\" }, []]) {\n      expect(failure(raw)).toContain(\"missing profiles array\");\n    }\n  });\n\n  test(\"rejects an unknown or missing schema version\", () => {\n    expect(failure({ profiles: [] })).toContain(\"unsupported schemaVersion\");\n    expect(failure({ schemaVersion: 2, profiles: [] })).toContain(\n      \"unsupported schemaVersion\",\n    );\n    expect(failure({ schemaVersion: \"1\", profiles: [] })).toContain(\n      \"unsupported schemaVersion\",\n    );\n  });\n\n  test(\"rejects profiles without a usable id\", () => {\n    expect(failure(snapshot([null]))).toContain(\"profile #0 has no id\");\n    expect(failure(snapshot([{ id: 7 }]))).toContain(\"profile #0 has no id\");\n    expect(failure(snapshot([{ id: \"\" }]))).toContain(\"profile #0 has no id\");\n  });\n\n  test(\"rejects ids with surrounding whitespace\", () => {\n    expect(failure(snapshot([profile({ id: \" P1 \" })]))).toContain(\n      \"profile #0 id has surrounding whitespace\",\n    );\n    expect(failure(snapshot([profile({ id: \"P1\\n\" })]))).toContain(\n      \"surrounding whitespace\",\n    );\n  });\n\n  test(\"rejects duplicate ids\", () => {\n    expect(failure(snapshot([profile(), profile({ id: \"P1\" })]))).toContain(\n      \"duplicate id P1\",\n    );\n  });\n\n  test(\"rejects non-finite numeric fields with the profile in the message\", () => {\n    expect(failure(snapshot([profile({ vol: \"10\" })]))).toContain(\n      \"profile snapshot: P1.vol is not a finite number\",\n    );\n    expect(failure(snapshot([profile({ clv: Number.NaN })]))).toContain(\n      \"profile snapshot: P1.clv is not a finite number\",\n    );\n    expect(failure(snapshot([profile({ sharp: Infinity })]))).toContain(\n      \"profile snapshot: P1.sharp is not a finite number\",\n    );\n  });\n\n  test(\"rejects non-string flags\", () => {\n    expect(failure(snapshot([profile({ flags: \"A\" })]))).toContain(\n      \"profile snapshot: P1.flags is not a string array\",\n    );\n    expect(failure(snapshot([profile({ flags: [1] })]))).toContain(\n      \"profile snapshot: P1.flags is not a string array\",\n    );\n  });\n});\n\ndescribe(\"snapshot loader success path\", () => {\n  test(\"freezes records and their flags\", () => {\n    const parsed = parseProfileSnapshot(\n      snapshot([\n        profile({ id: \"A\", flags: [\"X\", \"Y\"] }),\n        profile({ id: \"B\", flags: [] }),\n      ]),\n    );\n    expect(parsed).toHaveLength(2);\n    expect(Object.isFrozen(parsed)).toBe(true);\n    expect(Object.isFrozen(parsed[0])).toBe(true);\n    expect(Object.isFrozen(parsed[0]?.flags)).toBe(true);\n    expect(parsed[0]?.flags).toEqual([\"X\", \"Y\"]);\n    expect(parsed[1]?.flags).toEqual([]);\n  });\n});\n"},"tests/code_mode/profile_query.property.test.ts":{"tests":[{"id":"14","name":"tests/code_mode/profile_query.property.test.ts > query_profiles metamorphic properties > a smaller limit is an exact prefix of a larger one","location":{"start":{"column":1,"line":142}}},{"id":"15","name":"tests/code_mode/profile_query.property.test.ts > query_profiles metamorphic properties > default rows are the sentinel-free subsequence of includeSentinels rows","location":{"start":{"column":1,"line":171}}},{"id":"16","name":"tests/code_mode/profile_query.property.test.ts > query_prof t runQuery = async (args: unknown): Promise<"+"unknown> => {\n  try {\n    return await queryProfilesTool.execute(args);\n  } catch (error) {\n    return error;\n  }\n};\n\ndescribe(\"query_profiles property oracle\", () => {\n  test(\"arbitrary arguments satisfy the frozen oracle\", async () => {\n    await fc.assert(\n      fc.asyncProperty(\n        fieldArbitrary,\n        limitArbitrary,\n        includeArbitrary,\n        async (field, limit, includeSentinels) => {\n          const args = { field, limit, includeSentinels };\n          assertMatchesOracle(await runQuery(args), args);\n        },\n      ),\n      { numRuns: NUM_RUNS },\n    );\n  });\n\n  test(\"an omitted limit equals the default limit and ignores unrelated keys\", async () => {\n    await fc.assert(\n      fc.asyncProperty(\n        fc.constantFrom(\"clv\", \"vol\", \"sharp\"),\n        async (field) => {\n          const base = await queryProfilesTool.execute({ field });\n          const explicit = await queryProfilesTool.execute({\n            field,\n            limit: MAX_LIMIT,\n          });\n          const extras = await queryProfilesTool.execute({\n            field,\n            ignored: { nested: [1, 2, 3] },\n            includeSentinels: false,\n          });\n          expect(explicit).toEqual(base);\n          expect(extras).toEqual(base);\n          expect(isToolError(base)).toBe(false);\n        },\n      ),\n      { numRuns: NUM_RUNS },\n    );\n  });\n\n  test(\"sentinel rows appear only for includeSentinels === true\", async () => {\n    await fc.assert(\n      fc.asyncProperty(\n        fc.constantFrom(\"clv\", \"vol\", \"sharp\"),\n        fc.oneof(\n          fc.string(),\n          fc.integer(),\n          fc.object(),\n          fc.array(fc.anything()),\n          fc.boolean(),\n        ),\n        async (field, includeSentinels) => {\n          const result = await queryProfilesTool.execute({\n            field,\n            includeSentinels,\n          });\n          const expected = includeSentinels === true;\n          expect(result.rows.some((row) => row.sentinel)).toBe(expected);\n          expect(result.rows.every((row) => Number.isFinite(row.value))).toBe(\n            true,\n          );\n          expect(result.rows.every((row) => Array.isArray(row.flags))).toBe(\n            true,\n          );\n        },\n      ),\n      { numRuns: NUM_RUNS },\n    );\n  });\n});\n\ndescribe(\"query_profiles metamorphic properties\", () => {\n  const field = fc.constantFrom(\"clv\", \"vol\", \"sharp\");\n\n  test(\"a smaller limit is an exact prefix of a larger one\", async () => {\n    await fc.assert(\n      fc.asyncProperty(\n        field,\n        fc.integer({ min: 1, max: MAX_LIMIT + 1 }),\n        fc.integer({ min: 1, max: MAX_LIMIT + 1 }),\n        fc.boolean(),\n        async (fieldName, left, right, includeSentinels) => {\n          const small = Math.min(left, right);\n          const big = Math.max(left, right);\n          const a = await queryProfilesTool.execute({\n            field: fieldName,\n            limit: small,\n            includeSentinels,\n          });\n          const b = await queryProfilesTool.execute({\n            field: fieldName,\n            limit: big,\n            includeSentinels,\n          });\n          expect(a.rows).toEqual(b.rows.slice(0, a.rows.length));\n          expect(a.truncated).toBe(small > MAX_LIMIT);\n          expect(b.truncated).toBe(big > MAX_LIMIT);\n        },\n      ),\n      { numRuns: NUM_RUNS },\n    );\n  });\n\n  test(\"default rows are the sentinel-free subsequence of includeSentinels rows\", async () => {\n    await fc.assert(\n      fc.asyncProperty(field, async (fieldName) => {\n        const base = await queryProfilesTool.execute({\n          field: fieldName,\n          limit: MAX_LIMIT,\n        });\n        const all = await queryProfilesTool.execute({\n          field: fieldName,\n          limit: MAX_LIMIT,\n          includeSentinels: true,\n        });\n        expect(base.rows).toEqual(all.rows.filter((row) => !row.sentinel));\n      }),\n      { numRuns: NUM_RUNS },\n    );\n  });\n\n  test(\"repeated queries are deterministic and flags track get_profile\", async () => {\n    await fc.assert(\n      fc.asyncProperty(\n        field,\n        fc.integer({ min: 1, max: MAX_LIMIT }),\n        fc.boolean(),\n        async (fieldName, limit, includeSentinels) => {\n          const args = { field: fieldName, limit, includeSentinels };\n          const first = await queryProfilesTool.execute(args);\n          const second = await queryProfilesTool.execute(args);\n          expect(second).toEqual(first);\n          for (const row of first.rows) {\n            const profile = await getProfileTool.execute({ id: row.id });\n            expect([...row.flags]).toEqual([...profile.flags]);\n            expect(profile.id).toBe(row.id);\n          }\n        },\n      ),\n      { numRuns: NUM_RUNS },\n    );\n  });\n});\n"},"tests/code_mode/profile_query.synthetic.test.ts":{"tests":[{"id":"20","name":"tests/code_mode/profile_query.synthetic.test.ts > argument-object hardening > a null-prototype object with own properties is a valid argument bag","location":{"start":{"column":1,"line":207}}},{"id":"21","name":"tests/code_mode/profile_query.synthetic.test.ts > argument-object hardening > each argument is read exactly once","location":{"start":{"column":1,"line":162}}},{"id":"22","name":"tests/code_mode/profile_query.synthetic.test.ts > argument-object hardening > inherited properties are not arguments","location":{"start":{"column":1,"line":188}}},{"id":"23","name":"tests/code_mode/profile_query.synthetic.test.ts > parser round-trip > JSON serialize -> parse preserves query results for generated snapshots","location":{"start":{"column":1,"line":214}}},{"id":"24","name":"tests/code_mode/profile_query.synthetic.test.ts > querySnapshot over generated snapshots > argument validation is independent of the snapshot","location":{"start":{"column":1,"line":140}}},{"id":"25","name":"tests/code_mode/profile_query.synthetic.test.ts > querySnapshot over generated snapshots > empty and all-sentinel snapshots degrade honestly","location":{"start":{"column":1,"line":124}}},{"id":"26","name":"tests/code_mode/profile_query.synthetic.test.ts > querySnapshot over generated snapshots > matches the reference model for arbitrary data","location":{"start":{"column":1,"line":84}}},{"id":"27","name":"tests/code_mode/profile_query.synthetic.test.ts > querySnapshot over generated snapshots > never mutates the input snapshot and freezes its own result","location":{"start":{"column":1,"line":107}}},{"id":"28","name":"tests/code_mode/profile_query.synthetic.test.ts > row flag immutability > row flags are frozen copies and cannot mutate the input snapshot","location":{"start":{"column":1,"line":245}}}],"source":"import { describe, expect, test } from \"bun:test\";\nimport fc from \"fast-check\";\n\nimport {\n  MAX_LIMIT,\n  ToolError,\n  parseProfileSnapshot,\n  querySnapshot,\n  type ProfileField,\n  type ProfileRecord,\n} from \"../../lib/profile_query_tools.ts\";\n\nconst NUM_RUNS = (() => {\n  const raw = Number(process.env.FAST_CHECK_NUM_RUNS);\n  return Number.isInteger(raw) && raw > 0 ? raw : 100;\n})();\n\nconst seed = Number(process.env.FAST_CHECK_SEED);\nif (process.env.FAST_CHECK_SEED !== undefined && Number.isInteger(seed)) {\n  fc.configureGlobal({ seed });\n}\n\nconst FIELDS: readonly ProfileField[] = [\"clv\", \"vol\", \"sharp\"];\nconst isSentinel = (profile: ProfileRecord): boolean =>\n  profile.id.startsWith(\"SYNTH_\");\n\n// JSON cannot round-trip -0; normalize it so the round-trip property tests the data model, not\n// an IEEE-754 edge that the serialized format cannot represent.\nconst valueArbitrary = fc\n  .oneof(\n    fc.constantFrom(0, -1, 1, 2.5, -2.5),\n    fc.double({ min: -1000, max: 1000, noNaN: true, noDefaultInfinity: true }),\n  )\n  .map((value) => (Object.is(value, -0) ? 0 : value));\n\nconst profileArbitrary: fc.Arbitrary<"+"ProfileRecord> = fc\n  .record({\n    id: fc\n      .tuple(fc.boolean(), fc.integer({ min: 0, max: 999 }))\n      .map(([synthetic, n]) => `${synthetic ? \"SYNTH_\" : \"\"}P${n}`),\n    vol: valueArbitrary,\n    clv: valueArbitrary,\n    sharp: valueArbitrary,\n    flags: fc.array(fc.string({ maxLength: 8 }), { maxLength: 3 }),\n  })\n  .map((profile) =>\n    Object.freeze({ ...profile, flags: Object.freeze([...profile.flags]) }),\n  );\n\nconst snapshotArbitrary = fc.uniqueArray(profileArbitrary, {\n  selector: (profile) => profile.id,\n  maxLength: 40,\n});\n\n/** Straightforward model of the contract, written again over the generated snapshot. */\nfunction reference(\n  snapshot: readonly ProfileRecord[],\n  field: ProfileField,\n  includeSentinels: boolean,\n  limit: number,\n): readonly {\n  id: string;\n  value: number;\n  flags: readonly string[];\n  sentinel: boolean;\n}[] {\n  const rows = snapshot\n    .filter((profile) => includeSentinels || !isSentinel(profile))\n    .map((profile) => ({\n      id: profile.id,\n      value: profile[field],\n      flags: [...profile.flags],\n      sentinel: isSentinel(profile),\n    }));\n  rows.sort((left, right) => {\n    if (left.value !== right.value) return right.value - left.value;\n    return left.id <"+" right.id ? -1 : left.id > right.id ? 1 : 0;\n  });\n  return rows.slice(0, Math.min(limit, MAX_LIMIT));\n}\n\ndescribe(\"querySnapshot over generated snapshots\", () => {\n  test(\"matches the reference model for arbitrary data\", () => {\n    fc.assert(\n      fc.property(\n        snapshotArbitrary,\n        fc.constantFrom(...FIELDS),\n        fc.integer({ min: 1, max: MAX_LIMIT + 1 }),\n        fc.boolean(),\n        (snapshot, field, limit, includeSentinels) => {\n          const result = querySnapshot(snapshot, {\n            field,\n            limit,\n            includeSentinels,\n          });\n          const expected = reference(snapshot, field, includeSentinels, limit);\n          expect(result.field).toBe(field);\n          expect(result.rows).toEqual(expected);\n          expect(result.truncated).toBe(limit > MAX_LIMIT);\n        },\n      ),\n      { numRuns: NUM_RUNS },\n    );\n  });\n\n  test(\"never mutates the input snapshot and freezes its own result\", () => {\n    fc.assert(\n      fc.property(snapshotArbitrary, (snapshot) => {\n        const before = snapshot.map((profile) => ({\n          ...profile,\n          flags: [...profile.flags],\n        }));\n        const result = querySnapshot(snapshot, { field: \"clv\", limit: 10 });\n        expect(snapshot).toEqual(before);\n        expect(Object.isFrozen(result)).toBe(true);\n        expect(Object.isFrozen(result.rows)).toBe(true);\n        for (const row of result.rows) expect(Object.isFrozen(row)).toBe(true);\n      }),\n      { numRuns: NUM_RUNS },\n    );\n  });\n\n  test(\"empty and all-sentinel snapshots degrade honestly\", () => {\n    expect(querySnapshot([], { field: \"sharp\" })).toEqual({\n      field: \"sharp\",\n      rows: [],\n      truncated: false,\n    });\n    const syntheticOnly = [\n      { id: \"SYNTH_A\", vol: 1, clv: 2, sharp: 3, flags: [] },\n    ] as const;\n    expect(querySnapshot(syntheticOnly, { field: \"vol\" }).rows).toEqual([]);\n    expect(\n      querySnapshot(syntheticOnly, { field: \"vol\", includeSentinels: true })\n        .rows,\n    ).toHaveLength(1);\n  });\n\n  test(\"argument validation is independent of the snapshot\", () => {\n    const snapshot = [\n      { id: \"A\", vol: 1, clv: 2, sharp: 3, flags: [] },\n    ] as const;\n    for (const field of [\"__proto__\", \"constructor\", \"toString\", \"\", \" \"]) {\n      expect(() => querySnapshot(snapshot, { field })).toThrow(ToolError);\n    }\n    for (const limit of [0, -1, 1.5, Number.NaN, Infinity, \"5\"]) {\n      expect(() => querySnapshot(snapshot, { field: \"clv\", limit })).toThrow(\n        ToolError,\n      );\n    }\n  });\n});\n\ndescribe(\"argument-object hardening\", () => {\n  const many = [\n    { id: \"A\", vol: 1, clv: 2, sharp: 3, flags: [] },\n    { id: \"B\", vol: 2, clv: 3, sharp: 4, flags: [] },\n    { id: \"SYNTH_C\", vol: 3, clv: 4, sharp: 5, flags: [] },\n  ] as const;\n\n  test(\"each argument is read exactly once\", () => {\n    let fieldReads = 0;\n    let limitReads = 0;\n    let includeReads = 0;\n    const args = {\n      get field() {\n        fieldReads += 1;\n        return fieldReads === 1 ? \"clv\" : \"bogus\";\n      },\n      get limit() {\n        limitReads += 1;\n        return 2;\n      },\n      get includeSentinels() {\n        includeReads += 1;\n        return true;\n      },\n    };\n    const result = querySnapshot(many, args);\n    expect(fieldReads).toBe(1);\n    expect(limitReads).toBe(1);\n    expect(includeReads).toBe(1);\n    expect(result.field).toBe(\"clv\");\n    expect(result.rows.every((row) => Number.isFinite(row.value))).toBe(true);\n  });\n\n  test(\"inherited properties are not arguments\", () => {\n    const inherited = Object.create({\n      field: \"clv\",\n      limit: 1,\n      includeSentinels: true,\n    }) as Record<"+"string, unknown>;\n    expect(() => querySnapshot(many, inherited)).toThrow(ToolError);\n\n    const args = Object.assign(\n      Object.create({ limit: 1, includeSentinels: true }),\n      {\n        field: \"vol\",\n      },\n    );\n    const result = querySnapshot(many, args);\n    // Inherited limit/includeSentinels are ignored: default limit, sentinels excluded.\n    expect(result.rows.map((row) => row.id)).toEqual([\"B\", \"A\"]);\n  });\n\n  test(\"a null-prototype object with own properties is a valid argument bag\", () => {\n    const args = Object.assign(Object.create(null), { field: \"clv\", limit: 2 });\n    expect(querySnapshot(many, args).rows).toHaveLength(2);\n  });\n});\n\ndescribe(\"parser round-trip\", () => {\n  test(\"JSON serialize -> parse preserves query results for generated snapshots\", () => {\n    fc.assert(\n      fc.property(\n        snapshotArbitrary,\n        fc.constantFrom(...FIELDS),\n        fc.integer({ min: 1, max: MAX_LIMIT }),\n        fc.boolean(),\n        (snapshot, field, limit, includeSentinels) => {\n          const document = {\n            schemaVersion: 1,\n            profiles: snapshot.map((profile) => ({\n              ...profile,\n              flags: [...profile.flags],\n            })),\n          };\n          const reparsed = parseProfileSnapshot(\n            JSON.parse(JSON.stringify(document)),\n          );\n          expect(\n            querySnapshot(reparsed, { field, limit, includeSentinels }),\n          ).toEqual(\n            querySnapshot(snapshot, { field, limit, includeSentinels }),\n          );\n        },\n      ),\n      { numRuns: NUM_RUNS },\n    );\n  });\n});\n\ndescribe(\"row flag immutability\", () => {\n  test(\"row flags are frozen copies and cannot mutate the input snapshot\", () => {\n    const flags = [\"a\"];\n    const snapshot = [{ id: \"A\", vol: 1, clv: 2, sharp: 3, flags }];\n    const result = querySnapshot(snapshot, { field: \"vol\" });\n    expect(Object.isFrozen(result.rows[0]?.flags)).toBe(true);\n    expect(() =>\n      Reflect.apply(Array.prototype.push, result.rows[0]?.flags, [\"b\"]),\n    ).toThrow();\n    expect(flags).toEqual([\"a\"]);\n  });\n});\n"},"tests/code_mode/profile_query.unit.test.ts":{"tests":[{"id":"29","name":"tests/code_mode/profile_query.unit.test.ts > error surface > get_profile rejects non-object or blank arguments","location":{"start":{"column":1,"line":250}}},{"id":"30","name":"tests/code_mode/profile_query.unit.test.ts > error surface > get_profile_summary rejects non-object arguments but accepts absent ones","location":{"start":{"column":1,"line":265}}},{"id":"31","name":"tests/code_mode/profile_query.unit.test.ts > error surface > isToolError recognizes class and structural errors only","location":{"start":{"column":1,"line":230}}},{"id":"32","name":"tests/code_mode/profile_quer ","location":{"start":{"column":1,"line":36}}}],"source":"import { describe, expect, test } from \"bun:test\";\n\nimport {\n  MAX_LIMIT,\n  ToolError,\n  getProfileTool,\n  getSummaryTool,\n  isProfileSentinel,\n  isToolError,\n  parseProfileSnapshot,\n  queryProfilesTool,\n} from \"../../lib/profile_query_tools.ts\";\nimport {\n  EXPECTED_PROFILE_COUNT,\n  EXPECTED_SENTINEL_IDS,\n  MAX_LIMIT as ORACLE_MAX_LIMIT,\n  firstRegularProfile,\n  assertMatchesOracle,\n  oracleGetProfile,\n  oracleSummary,\n  snapshotProfiles,\n} from \"./oracle.ts\";\n\nconst SAMPLE_ID = firstRegularProfile().id;\n\nconst execute = async (args: unknown): Promise<"+"unknown> => {\n  try {\n    return await queryProfilesTool.execute(args);\n  } catch (error) {\n    return error;\n  }\n};\n\ndescribe(\"snapshot and contract constants\", () => {\n  test(\"the frozen snapshot has 31 profiles and 4 sentinels\", () => {\n    expect(snapshotProfiles()).toHaveLength(EXPECTED_PROFILE_COUNT);\n    const sentinels = snapshotProfiles()\n      .filter((profile) => profile.id.startsWith(\"SYNTH_\"))\n      .map((profile) => profile.id)\n      .sort();\n    expect(sentinels).toEqual([...EXPECTED_SENTINEL_IDS]);\n    expect(MAX_LIMIT).toBe(ORACLE_MAX_LIMIT);\n  });\n});\n\ndescribe(\"query_profiles row contract\", () => {\n  test(\"the default query returns every non-sentinel row exactly once\", async () => {\n    const result = await queryProfilesTool.execute({ field: \"clv\" });\n    expect(result.rows).toHaveLength(\n      EXPECTED_PROFILE_COUNT - EXPECTED_SENTINEL_IDS.length,\n    );\n    expect(new Set(result.rows.map((row) => row.id)).size).toBe(\n      result.rows.length,\n    );\n    expect(result.rows.every((row) => !row.sentinel)).toBe(true);\n    expect(result.truncated).toBe(false);\n    assertMatchesOracle(result, { field: \"clv\" });\n  });\n\n  test(\"includeSentinels === true adds exactly the sentinel rows\", async () => {\n    const result = await queryProfilesTool.execute({\n      field: \"vol\",\n      includeSentinels: true,\n    });\n    expect(result.rows).toHaveLength(EXPECTED_PROFILE_COUNT);\n    expect(\n      result.rows\n        .filter((row) => row.sentinel)\n        .map((row) => row.id)\n        .sort(),\n    ).toEqual([...EXPECTED_SENTINEL_IDS]);\n    assertMatchesOracle(result, { field: \"vol\", includeSentinels: true });\n  });\n\n  test(\"every row carries flags from its profile and a boolean sentinel\", async () => {\n    const result = await queryProfilesTool.execute({\n      field: \"sharp\",\n      includeSentinels: true,\n    });\n    for (const row of result.rows) {\n      expect(Array.isArray(row.flags)).toBe(true);\n      expect(row.flags.every((flag) => typeof flag === \"string\")).toBe(true);\n      expect(typeof row.sentinel).toBe(\"boolean\");\n      const profile = await getProfileTool.execute({ id: row.id });\n      expect([...row.flags]).toEqual([...profile.flags]);\n      expect(Number.isFinite(row.value)).toBe(true);\n    }\n  });\n\n  test(\"rows sort descending by the requested field\", async () => {\n    for (const field of [\"clv\", \"vol\", \"sharp\"] as const) {\n      const result = await queryProfilesTool.execute({\n        field,\n        includeSentinels: true,\n      });\n      for (let index = 1; index <"+" result.rows.length; index += 1) {\n        expect(result.rows[index - 1]!.value).toBeGreaterThanOrEqual(\n          result.rows[index]!.value,\n        );\n      }\n    }\n  });\n\n  test(\"truthy non-booleans do not opt into sentinels\", async () => {\n    for (const includeSentinels of [\n      \"yes\",\n      1,\n      {},\n      [],\n      \"true\",\n      0n,\n      Symbol(\"s\"),\n    ]) {\n      const result = await queryProfilesTool.execute({\n        field: \"clv\",\n        includeSentinels,\n      });\n      expect(result.rows.some((row) => row.sentinel)).toBe(false);\n      assertMatchesOracle(result, { field: \"clv\", includeSentinels });\n    }\n  });\n});\n\ndescribe(\"limit clamping and truncation\", () => {\n  test(\"limit below MAX_LIMIT truncates rows without flagging truncated\", async () => {\n    const result = await queryProfilesTool.execute({ field: \"clv\", limit: 3 });\n    expect(result.rows).toHaveLength(3);\n    expect(result.truncated).toBe(false);\n    assertMatchesOracle(result, { field: \"clv\", limit: 3 });\n  });\n\n  test(\"MAX_LIMIT and MAX_LIMIT+1 differ only in truncated\", async () => {\n    const atLimit = await queryProfilesTool.execute({\n      field: \"clv\",\n      limit: MAX_LIMIT,\n    });\n    const overLimit = await queryProfilesTool.execute({\n      field: \"clv\",\n      limit: MAX_LIMIT + 1,\n    });\n    expect(overLimit.rows).toEqual(atLimit.rows);\n    expect(atLimit.truncated).toBe(false);\n    expect(overLimit.truncated).toBe(true);\n    assertMatchesOracle(overLimit, { field: \"clv\", limit: MAX_LIMIT + 1 });\n  });\n\n  test(\"invalid limits are ToolErrors, never coerced\", async () => {\n    for (const limit of [\n      0,\n      -1,\n      -0,\n      1.5,\n      Number.NaN,\n      Infinity,\n      -Infinity,\n      \"5\",\n      null,\n    ]) {\n      const outcome = await execute({ field: \"clv\", limit });\n      expect(isToolError(outcome)).toBe(true);\n    }\n  });\n\n  test(\"a huge valid limit is clamped to MAX_LIMIT\", async () => {\n    const result = await queryProfilesTool.execute({\n      field: \"clv\",\n      limit: 1e9,\n    });\n    expect(result.rows.length).toBeLessThanOrEqual(MAX_LIMIT);\n    expect(result.truncated).toBe(true);\n  });\n});\n\ndescribe(\"field validation\", () => {\n  test(\"non-contract field names never leak through the prototype chain\", async () => {\n    for (const field of [\n      \"__proto__\",\n      \"constructor\",\n      \"toString\",\n      \"hasOwnProperty\",\n      \"\",\n      \" \",\n      \"CLV\",\n      \"vol \",\n      \"net\",\n    ]) {\n      const outcome = await execute({ field });\n      expect(isToolError(outcome)).toBe(true);\n    }\n  });\n\n  test(\"non-object arguments are ToolErrors\", async () => {\n    for (const args of [undefined, null, [], \"\", 42, \"vol\"]) {\n      expect(isToolError(await execute(args))).toBe(true);\n    }\n  });\n});\n\ndescribe(\"get_profile and get_profile_summary\", () => {\n  test(\"get_profile returns the frozen record and rejects unknown ids\", async () => {\n    const profile = await getProfileTool.execute({ id: \" \" + SAMPLE_ID + \" \" });\n    expect(profile.id).toBe(SAMPLE_ID);\n    expect(oracleGetProfile(SAMPLE_ID)).toMatchObject(profile);\n    await expect(getProfileTool.execute({ id: \"NOPE\" })).rejects.toThrow(\n      /unknown id/,\n    );\n    await expect(getProfileTool.execute({ id: \"  \" })).rejects.toThrow(\n      /id required/,\n    );\n  });\n\n  test(\"returned records are frozen and cannot corrupt the snapshot\", async () => {\n    const first = await getProfileTool.execute({ id: SAMPLE_ID });\n    expect(Object.isFrozen(first)).toBe(true);\n    expect(Object.isFrozen(first.flags)).toBe(true);\n    const second = await getProfileTool.execute({ id: SAMPLE_ID });\n    expect(second).toEqual(first);\n  });\n\n  test(\"summary equals the oracle's non-sentinel totals\", async () => {\n    const summary = await getSummaryTool.execute({});\n    expect(summary).toEqual(oracleSummary());\n    expect(Number.isFinite(summary.deltaVol)).toBe(true);\n    expect(Number.isFinite(summary.deltaNet)).toBe(true);\n  });\n});\n\ndescribe(\"error surface\", () => {\n  test(\"isToolError recognizes class and structural errors only\", () => {\n    expect(isToolError(new ToolError(\"x\"))).toBe(true);\n    expect(isToolError({ toolError: true })).toBe(true);\n    expect(isToolError({ toolError: false })).toBe(false);\n    expect(isToolError(new Error(\"x\"))).toBe(false);\n    expect(isToolError(null)).toBe(false);\n    expect(isToolError(undefined)).toBe(false);\n    expect(isToolError(\"toolError\")).toBe(false);\n    expect(isToolError(42)).toBe(false);\n  });\n\n  test(\"limit rejections name the positive-integer rule\", async () => {\n    await expect(\n      queryProfilesTool.execute({ field: \"clv\", limit: 1.5 }),\n    ).rejects.toThrow(/limit must be a positive integer/);\n    await expect(\n      queryProfilesTool.execute({ field: \"clv\", limit: Number.NaN }),\n    ).rejects.toThrow(/limit must be a positive integer/);\n  });\n\n  test(\"get_profile rejects non-object or blank arguments\", async () => {\n    for (const args of [\n      [],\n      42,\n      SAMPLE_ID,\n      null,\n      {},\n      { id: 5 },\n      { id: \"\" },\n      { id: \"   \" },\n    ]) {\n      await expect(getProfileTool.execute(args)).rejects.toThrow(/id required/);\n    }\n  });\n\n  test(\"get_profile_summary rejects non-object arguments but accepts absent ones\", async () => {\n    for (const args of [[], 42, \"x\", true]) {\n      await expect(getSummaryTool.execute(args)).rejects.toThrow(\n        /args must be an object/,\n      );\n    }\n    expect(await getSummaryTool.execute(undefined)).toEqual(oracleSummary());\n    expect(await getSummaryTool.execute(null)).toEqual(oracleSummary());\n  });\n});\n\ndescribe(\"flag and sentinel semantics\", () => {\n  const oracleProfile = (id: string) => {\n    const result = oracleGetProfile(id);\n    if (\"error\" in result) throw new Error(`oracle has no profile ${id}`);\n    return result;\n  };\n\n  test(\"row flags equal the snapshot's flags, not a filtered or empty copy\", async () => {\n    const expected = oracleProfile(SAMPLE_ID).flags;\n    expect(expected.length).toBeGreaterThan(0);\n    const profile = await getProfileTool.execute({ id: SAMPLE_ID });\n    expect([...profile.flags]).toEqual([...expected]);\n    const result = await queryProfilesTool.execute({\n      field: \"clv\",\n      includeSentinels: true,\n    });\n    const row = result.rows.find((entry) => entry.id === SAMPLE_ID);\n    expect(row?.flags).toEqual([...expected]);\n  });\n\n  test(\"sentinel state comes from the profile id, not its sort value\", () => {\n    const sentinel = snapshotProfiles().find((profile) =>\n      profile.id.startsWith(\"SYNTH_\"),\n    );\n    const regular = snapshotProfiles().find(\n      (profile) => !profile.id.startsWith(\"SYNTH_\"),\n    );\n    expect(sentinel).toBeDefined();\n    expect(regular).toBeDefined();\n    if (sentinel === undefined || regular === undefined) return;\n    expect(isProfileSentinel(sentinel)).toBe(true);\n    expect(isProfileSentinel(regular)).toBe(false);\n  });\n\n  test(\"equal sort values break ties by ascending id\", async () => {\n    const result = await queryProfilesTool.execute({\n      field: \"vol\",\n      limit: MAX_LIMIT,\n      includeSentinels: true,\n    });\n    const zeros = result.rows\n      .filter((row) => row.value === 0)\n      .map((row) => row.id);\n    expect(zeros.length).toBeGreaterThan(1);\n    expect(zeros).toEqual([...zeros].sort());\n  });\n});\n\ndescribe(\"sentinel semantics are state, not value\", () => {\n  test(\"a real profile carrying sentinel values is not a sentinel row\", () => {\n    const parsed = parseProfileSnapshot({\n      schemaVersion: 1,\n      profiles: [\n        { id: \"REAL1\", vol: 1, clv: -2_147_483_648, sharp: -1, flags: [] },\n      ],\n    });\n    const profile = parsed[0];\n    expect(profile).toBeDefined();\n    if (profile === undefined) return;\n    expect(isProfileSentinel(profile)).toBe(false);\n  });\n});\n\ndescribe(\"get_profile argument hardening\", () => {\n  test(\"reads id once and ignores an inherited id\", async () => {\n    let reads = 0;\n    const args = {\n      get id() {\n        reads += 1;\n        return reads === 1 ? SAMPLE_ID : 42;\n      },\n    };\n    const profile = await getProfileTool.execute(args);\n    expect(reads).toBe(1);\n    expect(profile.id).toBe(SAMPLE_ID);\n\n    const inherited = Object.create({ id: SAMPLE_ID }) as Record<"+"\n      string,\n      unknown\n    >;\n    await expect(getProfileTool.execute(inherited)).rejects.toThrow(\n      /id required/,\n    );\n  });\n});\n"},"tests/code_mode/quickjs_guest.test.ts":{"tests":[{"id":"53","name":"tests/code_mode/quickjs_guest.test.ts > argument marshalling budgets > a cyclic argument fails cleanly instead of hanging","location":{"start":{"column":1,"line":217}}},{"id":"54","name":"tests/code_mode/quickjs_guest.test.ts > argument marshalling budgets > a deeply nested argument no longer aborts the QuickJS runtime","location":{"start":{"column":1,"line":225}}},{"id":"55","name":"tests/code_mode/quickjs_guest.test.ts > argument marshalling budgets > a huge guest array is rejected before it reaches the host","location":{"start":{"column":1,"line":208}}},{"id":"56","name":"tests/code_mode/quickjs_guest.test.ts > argument marshalling budgets > non-JSON values are dropped by the packing boundary","location":{"start":{"column":1,"line":234}}},{"id":"57","name":"tests/code_mode/quickjs_guest.test.ts > async cells and resource ceilings > a guest can catch a host tool error and read its message","location":{"start":{"column":1,"line":158}}},{"id":"58","name":"tests/code_mode/quickjs_guest.test.ts > async cells and resource ceilings > a never-settling promise waits for the host deadline, not longer","location":{"start":{"column":1,"line":125}}},{"id":"59","name":"tests/code_mode/quickjs_guest.test.ts > async cells and resource ceilings > an awaited rejection surfaces as a guest failure","location":{"start":{"column":1,"line":119}}},{"id":"60","name":"tests/code_mode/quickjs_guest.test.ts > async cells and resource ceilings > awaits promises and tool calls","location":{"start":{"column":1,"line":111}}},{"id":"61","name":"tests/code_mode/quickjs_guest.test.ts > async cells and resource ceilings > infinite recursion is a guest stack overflow, not a host crash","location":{"start":{"column":1,"line":135}}},{"id":"62","name":"tests/code_mode/quickjs_guest.test.ts > async cells and resource ceilings > the heap cap stops runaway allocation","location":{"start":{"column":1,"line":141}}},{"id":"63","name":"tests/code_mode/quickjs_guest.test.ts > async cells and resource ceilings > the tool-call budget is per cell, not process-wide","location":{"start":{"column":1,"line":149}}},{"id":"64","name":"tests/code_mode/quickjs_guest.test.ts > option normalization and error shapes > a non-Error throw is still described","location":{"start":{"column":1,"line":202}}},{"id":"65","name":"tests/code_mode/quickjs_guest.test.ts > option normalization and error shapes > a syntax error is a guest failure","location":{"start":{"column":1,"line":198}}},{"id":"66","name":"tests/code_mode/quickjs_guest.test.ts > option normalization and error shapes > a zero-argument tool call marshals undefined","location":{"start":{"column":1,"line":192}}},{"id":"67","name":"tests/code_mode/quickjs_guest.test.ts > option normalization and error shapes > invalid option values fall back to the defaults","location":{"start":{"column":1,"line":167}}},{"id":"68","name":"tests/code_mode/quickjs_guest.test.ts > option normalization and error shapes > the tool budget is exact and floors fractional values","location":{"start":{"column":1,"line":173}}},{"id":"69","name":"tests/code_mode/quickjs_guest.test.ts > QuickJS guest boundary > a guest cell can query profiles through the bridge","location":{"start":{"column":1,"line":33}}},{"id":"70","name":"tests/code_mode/quickjs_guest.test.ts > QuickJS guest boundary > a guest cell sees the same frozen profile as the host","location":{"start":{"column":1,"line":41}}},{"id":"71","name":"tests/code_mode/quickjs_guest.test.ts > QuickJS guest boundary > guest globalThis does not expose host capabilities","location":{"start":{"column":1,"line":15}}},{"id":"72","name":"tests/code_mode/quickjs_guest.test.ts > QuickJS guest boundary > host tool errors surface as guest exceptions","location":{"start":{"column":1,"line":49}}},{"id":"73","name":"tests/code_mode/quickjs_guest.test.ts > QuickJS guest boundary > typeof host identifiers is undefined inside the guest","location":{"start":{"column":1,"line":26}}},{"id":"74","name":"tests/code_mode/quickjs_guest.test.ts > sandbox resource and isolation guarantees > a value that cannot cross the boundary is rejected","location":{"start":{"column":1,"line":103}}},{"id":"75","name":"tests/code_mode/quickjs_guest.test.ts > sandbox resource and isolation guarantees > an infinite loop is interrupted by the timeout","location":{"start":{"column":1,"line":57}}},{"id":"76","name":"tests/code_mode/quickjs_guest.test.ts > sandbox resource and isolation guarantees > each cell gets a fresh realm","location":{"start":{"column":1,"line":74}}},{"id":"77","name":"tests/code_mode/quickjs_guest.test.ts > sandbox resource and isolation guarantees > guest mutation of a tool result cannot reach the host snapshot","location":{"start":{"column":1,"line":80}}},{"id":"78","name":"tests/code_mode/quickjs_guest.test.ts > sandbox resource and isolation guarantees > the Function constructor stays inside the guest realm","location":{"start":{"column":1,"line":94}}},{"id":"79","name":"tests/code_mode/quickjs_guest.test.ts > sandbox resource and isolation guarantees > the tool-call budget stops a runaway cell","location":{"start":{"column":1,"line":63}}}],"source":"import { describe, expect, test } from \"bun:test\";\n\nimport { runGuestCell } from \"../../lib/quickjs_code_mode.ts\";\nimport {\n  assertMatchesOracle,\n  firstRegularProfile,\n  oracleSummary,\n} from \"./oracle.ts\";\nimport { BANNED_GUEST_GLOBALS, probeGuestGlobals } from \"./guest_probe.ts\";\n\nconst SAMPLE = firstRegularProfile();\n\ndescribe(\"QuickJS guest boundary\", () => {\n  test(\"guest globalThis does not expose host capabilities\", async () => {\n    const names = await probeGuestGlobals();\n    expect(Array.isArray(names)).toBe(true);\n    for (const banned of BANNED_GUEST_GLOBALS) {\n      expect(names).not.toContain(banned);\n    }\n    // A real realm still has the language intrinsics and the tools bridge.\n    expect(names).toContain(\"Object\");\n    expect(names).toContain(\"tools\");\n  });\n\n  test(\"typeof host identifiers is undefined inside the guest\", async () => {\n    const kinds = await runGuestCell(\n      \"return [typeof Bun, typeof process, typeof require, typeof module]\",\n    );\n    expect(kinds).toEqual([\"undefined\", \"undefined\", \"undefined\", \"undefined\"]);\n  });\n\n  test(\"a guest cell can query profiles through the bridge\", async () => {\n    const args = { field: \"sharp\", limit: 500 };\n    const guest = await runGuestCell(\n      `return tools.query_profiles(${JSON.stringify(args)})`,\n    );\n    assertMatchesOracle(guest, args);\n  });\n\n  test(\"a guest cell sees the same frozen profile as the host\", async () => {\n    const guest = await runGuestCell(\n      \"return tools.get_profile({ id: \" + JSON.stringify(SAMPLE.id) + \" })\",\n    );\n    expect(guest).toMatchObject({ id: SAMPLE.id, vol: SAMPLE.vol });\n    expect((guest as { flags?: unknown }).flags).toBeArray();\n  });\n\n  test(\"host tool errors surface as guest exceptions\", async () => {\n    await expect(\n      runGuestCell('return tools.query_profiles({ field: \"toString\" })'),\n    ).rejects.toThrow(/field required/);\n  });\n});\n\ndescribe(\"sandbox resource and isolation guarantees\", () => {\n  test(\"an infinite loop is interrupted by the timeout\", async () => {\n    await expect(\n      runGuestCell(\"while (true) {}\", { timeoutMs: 75 }),\n    ).rejects.toThrow(/guest cell failed/);\n  });\n\n  test(\"the tool-call budget stops a runaway cell\", async () => {\n    await expect(\n      runGuestCell(\n        \"for (let i = 0; i <"+" 10; i += 1) tools.get_profile({ id: \" +\n          JSON.stringify(SAMPLE.id) +\n          ' }); return \"ok\";',\n        { maxToolCalls: 3 },\n      ),\n    ).rejects.toThrow(/ERR_CODE_MODE_MAX_CALLS/);\n  });\n\n  test(\"each cell gets a fresh realm\", async () => {\n    await runGuestCell(\"globalThis.__leak = 42; return 1\");\n    const leaked = await runGuestCell(\"return typeof globalThis.__leak\");\n    expect(leaked).toBe(\"undefined\");\n  });\n\n  test(\"guest mutation of a tool result cannot reach the host snapshot\", async () => {\n    const before = await runGuestCell(\n      \"const p = tools.get_profile({ id: \" +\n        JSON.stringify(SAMPLE.id) +\n        ' }); p.flags.push(\"hacked\"); p.vol = -1; return p.flags.length;',\n    );\n    expect(before).toBe(SAMPLE.flags.length + 1);\n    const after = await runGuestCell(\n      \"return tools.get_profile({ id: \" + JSON.stringify(SAMPLE.id) + \" })\",\n    );\n    expect(after).toMatchObject({ id: SAMPLE.id, vol: SAMPLE.vol });\n    expect((after as { flags: string[] }).flags).not.toContain(\"hacked\");\n  });\n\n  test(\"the Function constructor stays inside the guest realm\", async () => {\n    const kind = await runGuestCell(\n      \"const p = tools.get_profile({ id: \" +\n        JSON.stringify(SAMPLE.id) +\n        ' }); return p.constructor.constructor(\"return typeof process\")();',\n    );\n    expect(kind).toBe(\"undefined\");\n  });\n\n  test(\"a value that cannot cross the boundary is rejected\", async () => {\n    await expect(runGuestCell(\"return Symbol('x')\")).rejects.toThrow(\n      /cannot cross the boundary/,\n    );\n  });\n});\n\ndescribe(\"async cells and resource ceilings\", () => {\n  test(\"awaits promises and tool calls\", async () => {\n    expect(await runGuestCell(\"return await Promise.resolve(41) + 1\")).toBe(42);\n    const id = await runGuestCell(\n      'const r = await tools.query_profiles({ field: \"sharp\", limit: 1 }); return r.rows[0].id;',\n    );\n    expect(typeof id).toBe(\"string\");\n  });\n\n  test(\"an awaited rejection surfaces as a guest failure\", async () => {\n    await expect(\n      runGuestCell('await Promise.reject(new Error(\"nope\"))'),\n    ).rejects.toThrow(/nope/);\n  });\n\n  test(\"a never-settling promise waits for the host deadline, not \"for (let i = 0; i <"+" 2; i += 1) tools.get_profile({ id: \" +\n      JSON.stringify(SAMPLE.id) +\n      ' }); return \"ok\";';\n    const threeCalls =\n      \"for (let i = 0; i <"+" 3; i += 1) tools.get_profile({ id: \" +\n      JSON.stringify(SAMPLE.id) +\n      ' }); return \"ok\";';\n    expect(await runGuestCell(twoCalls, { maxToolCalls: 2 })).toBe(\"ok\");\n    await expect(runGuestCell(threeCalls, { maxToolCalls: 2 })).rejects.toThrow(\n      /MAX_CALLS/,\n    );\n    expect(await runGuestCell(twoCalls, { maxToolCalls: 2.9 })).toBe(\"ok\");\n    await expect(\n      runGuestCell(threeCalls, { maxToolCalls: 2.9 }),\n    ).rejects.toThrow(/MAX_CALLS/);\n  });\n\n  test(\"a zero-argument tool call marshals undefined\", async () => {\n    expect(await runGuestCell(\"return tools.get_profile_summary()\")).toEqual(\n      oracleSummary(),\n    );\n  });\n\n  test(\"a syntax error is a guest failure\", async () => {\n    await expect(runGuestCell(\"return )\")).rejects.toThrow(/guest cell failed/);\n  });\n\n  test(\"a non-Error throw is still described\", async () => {\n    await expect(runGuestCell(\"throw 42\")).rejects.toThrow(/42/);\n  });\n});\n\ndescribe(\"argument marshalling budgets\", () => {\n  test(\"a huge guest array is rejected before it reaches the host\", async () => {\n    await expect(\n      runGuestCell(\n        'const a = new Array(2000000).fill(0); return tools.query_profiles({ field: \"clv\", limit: 1, junk: a })',\n        { timeoutMs: 3000 },\n      ),\n    ).rejects.toThrow(/ARGUMENT_TOO_LARGE/);\n  });\n\n  test(\"a cyclic argument fails cleanly instead of hanging\", async () => {\n    await expect(\n      runGuestCell(\"const a = {}; a.self = a; return tools.query_profiles(a)\", {\n        timeoutMs: 3000,\n      }),\n    ).rejects.toThrow(/circular|guest cell failed/);\n  });\n\n  test(\"a deeply nested argument no longer aborts the QuickJS runtime\", async () => {\n    const result = await runGuestCell(\n      'let o = {}; let c = o; for (let i = 0; i <"+" 20000; i += 1) { c.n = {}; c = c.n; } return tools.query_profiles({ field: \"clv\", limit: 1, junk: o })',\n      { timeoutMs: 3000 },\n    );\n    expect(result).toMatchObject({ field: \"clv\" });\n    expect((result as { rows: unknown[] }).rows).toHaveLength(1);\n  });\n\n  test(\"non-JSON values are dropped by the packing boundary\", async () => {\n    const result = await runGuestCell(\n      'return tools.query_profiles({ field: \"clv\", limit: 1, junk: () => 1 })',\n    );\n    expect((result as { rows: unknown[] }).rows).toHaveLength(1);\n    await expect(\n      runGuestCell(\"return tools.query_profiles(() => 1)\"),\n    ).rejects.toThrow(/ARGUMENT_UNSUPPORTED|guest cell failed/);\n  });\n});\n"},"tests/code_mode/quickjs_marshal.test.ts":{"tests":[{"id":"80","name":"tests/code_mode/quickjs_marshal.test.ts > host -> guest marshalling > allocated primitives are owned and round-trip","location":{"start":{"column":1,"line":38}}},{"id":"81","name":"tests/code_mode/quickjs_marshal.test.ts > host -> guest marshalling > arrays and nested objects round-trip with ownership","location":{"start":{"column":1,"line":49}}},{"id":"82","name":"tests/code_mode/quickjs_marshal.test.ts > host -> guest marshalling > static values are not owned by the caller","location":{"start":{"column":1,"line":31}}},{"id":"83","name":"tests/code_mode/quickjs_marshal.test.ts > host -> guest marshalling > values that cannot be marshalled are rejected","location":{"start":{"column":1,"line":63}}}],"source":"import { describe, expect, test } from \"bun:test\";\nimport { afterAll } from \"bun:test\";\nimport {\n  getQuickJS,\n  type QuickJSContext,\n  type QuickJSRuntime,\n} from \"quickjs-emscripten\";\n\nimport { toGuest } from \"../../lib/quickjs_code_mode.ts\";\n\nconst QuickJS = await getQuickJS();\nconst runtime: QuickJSRuntime = QuickJS.newRuntime();\nconst ctx: QuickJSContext = runtime.newContext();\n\nafterAll(() => {\n  ctx.dispose();\n  runtime.dispose();\n});\n\nconst roundTrip = (value: unknown): { value: unknown; owned: boolean } => {\n  const guest = toGuest(ctx, value);\n  try {\n    return { value: ctx.dump(guest.handle), owned: guest.owned };\n  } finally {\n    if (guest.owned) guest.handle.dispose();\n  }\n};\n\ndescribe(\"host -> guest marshalling\", () => {\n  test(\"static values are not owned by the caller\", () => {\n    expect(roundTrip(null)).toEqual({ value: null, owned: false });\n    expect(roundTrip(undefined)).toEqual({ value: undefined, owned: false });\n    expect(roundTrip(true)).toEqual({ value: true, owned: false });\n    expect(roundTrip(false)).toEqual({ value: false, owned: false });\n  });\n\n  test(\"allocated primitives are owned and round-trip\", () => {\n    expect(roundTrip(0)).toEqual({ value: 0, owned: true });\n    expect(roundTrip(-1.5)).toEqual({ value: -1.5, owned: true });\n    expect(roundTrip(Number.MAX_SAFE_INTEGER)).toEqual({\n      value: Number.MAX_SAFE_INTEGER,\n      owned: true,\n    });\n    expect(roundTrip(\"\")).toEqual({ value: \"\", owned: true });\n    expect(roundTrip(\"λ\")).toEqual({ value: \"λ\", owned: true });\n  });\n\n  test(\"arrays and nested objects round-trip with ownership\", () => {\n    expect(roundTrip([])).toEqual({ value: [], owned: true });\n    expect(roundTrip([1, \"a\", true, null])).toEqual({\n      value: [1, \"a\", true, null],\n      owned: true,\n    });\n    expect(roundTrip({ a: 1, b: { c: \"x\", d: [false, null] }, e: [] })).toEqual(\n      {\n        value: { a: 1, b: { c: \"x\", d: [false, null] }, e: [] },\n        owned: true,\n      },\n    );\n  });\n\n  test(\"values that cannot be marshalled are rejected\", () => {\n    expect(() => toGuest(ctx, () => 1)).toThrow(/cannot marshal function/);\n    expect(() => toGuest(ctx, Symbol(\"s\"))).toThrow(/cannot marshal symbol/);\n    expect(() => toGuest(ctx, 1n)).toThrow(/cannot marshal bigint/);\n  });\n});\n"}},"projectRoot":"/Users/nolarose/code/sportsdesk-ops","config":{"plugins":
